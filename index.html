<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vortex</title><script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8ef;color:#173c24;font-family:Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}.wrap{width:100%;max-width:600px;margin:auto;padding:18px 15px 90px}.title{font-size:27px;font-weight:900;margin:7px 0}.sub,.small{color:#78917c;font-size:12px}.sub{margin:4px 0 15px}.card{background:#fffdf5;border:1px solid #dce7d9;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #173c2408}.big{font-size:25px;font-weight:900}.primary{width:100%;padding:13px;border-radius:12px;background:#a8cda9;color:#173c24;font-weight:900;margin-top:8px}.danger{background:#e7b8b3!important;color:#702b25!important}.input{width:100%;padding:13px;border:1px solid #dce7d9;border-radius:11px;background:#fffdf5;outline:0;color:#173c24;margin:5px 0 9px}.input:focus{border-color:#a8cda9}.msg{padding:11px;border-radius:10px;font-size:12px}.msg.ok{background:#e8f1e3}.msg.err{background:#f8dfdc}.empty{text-align:center;color:#78917c;padding:15px}.back{background:transparent;color:#216b35;font-weight:900;padding:5px 0}.nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#fffdf5;border-top:1px solid #dce7d9;display:flex;justify-content:center;z-index:20}.nav button{flex:1;max-width:200px;background:transparent;color:#78917c;font-weight:800}.nav button.active{color:#216b35}.balance{background:#dcebd8!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statBox{background:#e8f1e3;border-radius:13px;padding:12px}.statBox b{display:block;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:17px 10px;background:#e8f1e3;border-radius:15px;text-align:center;font-weight:900;color:#216b35}.product{display:flex;justify-content:space-between;gap:10px;align-items:center}.product .price{font-size:18px;font-weight:900}.product .earn{font-size:12px;color:#78917c;margin-top:3px}.product button{background:#a8cda9;padding:10px 13px;border-radius:10px;font-weight:900}.guideBtn{width:100%;display:flex;align-items:center;gap:10px;background:#fffdf5;border:1px solid #dce7d9;border-radius:13px;padding:13px;margin-top:9px;text-align:left;color:#173c24}.guideBtn span{flex:1}.guideBtn small{display:block;color:#78917c;margin-top:2px}.top{display:flex;justify-content:space-between;align-items:center}.modalBg{position:fixed;inset:0;background:#173c2466;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal{background:#fffdf5;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow:auto}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#173c24;color:white;padding:11px 16px;border-radius:10px;display:none;z-index:100;max-width:90%;text-align:center}.logo{font-size:34px;font-weight:1000;color:#216b35;text-align:center}.auth{min-height:100vh;display:flex;align-items:center}.auth .card{width:100%}
</style></head><body>
<div id="authScreen"><div class="wrap auth"><div style="width:100%"><div class="logo">VORTEX</div><div class="sub" style="text-align:center">Enjoy Your Ride</div><div class="card" id="authBox"></div></div></div></div>

<script>
const{Client,Account,TablesDB,ID,Query}=Appwrite;
const ENDPOINT="https://cloud.appwrite.io/v1",PROJECT_ID="6a903d26002edcba7c43",DATABASE_ID="6ab93e1f001b1a60b658";
const USERS_TABLE_ID="6ab972e60038e2121462",DEPOSITS_TABLE_ID="6abc15840015fbc8ad75",WITHDRAWALS_TABLE_ID="6abc1c3d0006a5526d37",PRODUCTS_TABLE_ID="6abc2545003164242377",INVESTMENTS_TABLE_ID="6abc26e2000f85014be0",REFERRALS_TABLE_ID="6abcfb0b0027beb5cb1a",RECIPIENTS_TABLE_ID="6ac0a39600062c828059";
const client=new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID),account=new Account(client),db=new TablesDB(client);
let user=null,profile=null,currentScreen="home",selectedRecipient="",recipients=[],purchaseBusy=false,busyInvestment=false,liveTimer=null,sessionTimer=null,investmentRecords=[],accountRefreshing=false,investmentRefreshCache=null,withdrawRefreshPromise=null,lastActivity=0;
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("en-UG"),iso=d=>new Date(d).toISOString();
const DAILY=[["Start",10000,1000],["Rise",25000,2500],["Drive",50000,5000],["Boost",100000,10000],["Power",250000,25000],["Pro",500000,50000],["Prime",1000000,100000],["Elite",2000000,200000],["Max",3000000,300000],["Ultra",5000000,500000]];
const TIME=[["Sprint",10000,22000],["Momentum",25000,55000],["Surge",50000,110000],["Advance",100000,220000],["Titan",250000,550000],["Apex",500000,1100000],["Infinity",1000000,2200000],["Summit",2000000,4400000],["Horizon",3000000,6600000],["Zenith",5000000,11000000]];
const VIP_LEVELS=[{level:1,active:0,minutes:20,tax:20,ref:10},{level:2,active:2,minutes:15,tax:15,ref:15},{level:3,active:5,minutes:12,tax:12,ref:18},{level:4,active:10,minutes:10,tax:10,ref:20},{level:5,active:25,minutes:8,tax:8,ref:25},{level:6,active:35,minutes:5,tax:5,ref:40}];

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function msg(t,type=""){return`<div class="msg ${type}">${esc(t)}</div>`}
let toastTimer;
function toast(t){let x=$("toast");x.textContent=t;x.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.style.display="none",2800)}
function open(html){$("modal").innerHTML=html;$("modalBg").style.display="flex"}
function close(){$("modalBg").style.display="none"}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.add("hide"));$(id).classList.remove("hide")}
function nav(x){$("bottomNav").classList.remove("hide");document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("active",b.dataset.action===x))}
function busy(b){b.disabled=true;b.dataset.old=b.innerHTML;b.innerHTML="Please wait..."}
function ready(b){b.disabled=false;b.innerHTML=b.dataset.old||b.innerHTML}
function validPhone(x){return/^07\d{8}$/.test(String(x||""))}
function validEmail(x){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x||""))}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Copy failed")}}
function openLink(u){window.open(u,"_blank")}
function dayStart(){let d=new Date();d.setHours(0,0,0,0);return d}
function calendarDayNumber(d){return Math.floor((new Date(d)-dayStart())/86400000)}
function workingDaysPassed(start){let s=new Date(start),n=0,d=new Date(s);d.setHours(0,0,0,0);while(d<dayStart()){let w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function addWorkingDaysInclusive(start,n){let d=new Date(start);d.setHours(0,0,0,0);let c=0;while(c<n){let w=d.getDay();if(w!==0&&w!==6)c++;if(c<n)d.setDate(d.getDate()+1)}return d}
async function listRows(table,queries=[]){let r=await db.listRows(DATABASE_ID,table,queries);return r.rows||[]}
async function getProfile(){if(!user)return null;let a=await listRows(USERS_TABLE_ID,[Query.equal("$id",user.$id)]);return a[0]||null}
async function updateUser(data){if(!user)return;profile=await db.updateRow(DATABASE_ID,USERS_TABLE_ID,user.$id,data);return profile}
function updateHeader(){if($("welcome"))$("welcome").textContent=profile?.displayname||"Elyte"}
async function syncWallet(){return profile}
function vipForActive(n){let x=1;VIP_LEVELS.forEach(v=>{if(Number(n||0)>=v.active)x=v.level});return x}
function getVipForUser(){return Number(profile?.viplevel||1)}
async function syncVip(){if(!profile)return;let active=Number(profile.active||0),v=vipForActive(active);if(v!==Number(profile.viplevel||1))await updateUser({viplevel:v})}
async function processInvestments(){return}
async function loadInvestmentRecords(){if(!user){investmentRecords=[];return[]}try{investmentRecords=await listRows(INVESTMENTS_TABLE_ID,[Query.equal("userId",user.$id)]);return investmentRecords}catch(e){investmentRecords=[];return[]}}
function investmentProgress(x){let st=new Date(x.createdat||x.$createdAt),days=Number(x.days||x.duration||20),p=Math.min(days,Math.max(0,workingDaysPassed(st)));return{days,pct:days?Math.min(100,p/days*100):0}}
function investmentTable(){return""}
function investmentRecordsHTML(){if(!investmentRecords.length)return"";return`<div class="card"><b>Active Investments</b>${investmentRecords.slice(0,10).map(x=>{let p=investmentProgress(x);return`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #dce7d9"><b>${esc(x.product||x.name||"Investment")}</b><div class="small">UGX ${fmt(x.amount)} · ${p.pct.toFixed(0)}% complete</div></div>`}).join("")}</div>`}
async function refreshAccount(){if(accountRefreshing||!user)return;accountRefreshing=true;try{profile=await getProfile();await syncVip();profile=await getProfile();updateHeader()}finally{accountRefreshing=false}}
function products(type){let a=type==="daily"?DAILY:TIME;return a.map((x,i)=>({name:x[0],amount:x[1],return:x[2],type,index:i,duration:type==="daily"?30:20}))}
function findProduct(id){let [t,i]=String(id).split(":");return products(t)[Number(i)]}
function renderProduct(p){return`<div class="card product"><div><div class="price">${esc(p.name)}</div><div class="small">Investment: UGX ${fmt(p.amount)}</div><div class="earn">${p.type==="daily"?`UGX ${fmt(p.return)} daily × 30 days`:`Return UGX ${fmt(p.return)} over ${p.duration} working days`}</div></div><button data-action="buy" data-id="${p.type}:${p.index}">Buy</button></div>`}
function category(t){currentScreen=t;screen("categoryScreen");nav("home");$("categoryContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">${t==="daily"?"Daily Products":"Time Products"}</div><div class="sub">${t==="daily"?"Earn daily according to your purchased amount.":"Returns are released at maturity."}</div>${products(t).map(renderProduct).join("")}`}
async function buy(id){let p=findProduct(id);if(!p)return;open(`<div class="title">Confirm Purchase</div><div class="card"><b>${esc(p.name)}</b><div class="small">Amount</div><div class="big">UGX ${fmt(p.amount)}</div><div class="small">${p.type==="daily"?`Daily earning: UGX ${fmt(p.return)}`:`Maturity return: UGX ${fmt(p.return)}`}</div></div><button class="primary" data-action="purchase" data-id="${esc(id)}">Confirm Purchase</button><button class="primary" style="background:#e8f1e3" data-action="close">Cancel</button>`)}
 <script>
async function purchase(id){if(purchaseBusy)return;let p=findProduct(id);if(!p||!profile)return;purchaseBusy=true;try{await refreshAccount();if(Number(profile.wallet||0)<p.amount){toast("Insufficient Wallet balance");return}let now=iso(new Date),data={userId:user.$id,username:profile.username||"",product:p.name,name:p.name,type:p.type,amount:p.amount,returnamount:p.return,duration:p.duration,createdat:now,status:"active",lastcredit:now};await db.createRow(DATABASE_ID,INVESTMENTS_TABLE_ID,ID.unique(),data);await updateUser({wallet:Number(profile.wallet||0)-p.amount});await creditReferral(p.amount);await refreshAccount();close();toast("Purchase successful");await loadInvestmentRecords();if(currentScreen==="my")renderMy()}catch(e){console.log(e);toast(e.message||"Purchase failed")}finally{purchaseBusy=false}}
async function creditReferral(amount){try{let uid=profile?.referrerId||profile?.referrer||profile?.referredBy;if(!uid)return;let r=await listRows(USERS_TABLE_ID,[Query.equal("$id",uid)]),u=r[0];if(!u)return;let lv=Math.max(1,Math.min(6,Number(u.viplevel||1))),rate=VIP_LEVELS[lv-1].ref||10,earn=Math.round(Number(amount||0)*rate/100);await db.updateRow(DATABASE_ID,USERS_TABLE_ID,u.$id,{balance:Number(u.balance||0)+earn,totalreferral:Number(u.totalreferral||0)+earn})}catch(e){console.log("Referral:",e)}}
async function loadRecipients(){try{recipients=await listRows(RECIPIENTS_TABLE_ID,[]);if(!recipients.length)recipients=[{name:"Reagan Ssentongo",phone:""},{name:"Lawrence Lutaaya",phone:""},{name:"Fabious Bahati",phone:""}]}catch(e){recipients=[{name:"Reagan Ssentongo",phone:""},{name:"Lawrence Lutaaya",phone:""},{name:"Fabious Bahati",phone:""}]}return recipients}
async function deposit(){await loadRecipients();let r=recipients[Math.floor(Math.random()*recipients.length)];selectedRecipient=r.phone||r.number||r.mobile||"";open(`<div class="title">Deposit</div><div class="sub">Send your deposit to the assigned recipient.</div><div class="card balance"><div class="small">Recipient</div><b>${esc(r.name||"Vortex Recipient")}</b>${selectedRecipient?`<div class="big" style="margin-top:5px">${esc(selectedRecipient)}</div><button class="primary" data-action="copy-recipient">Copy Number</button>`:`<div class="small" style="margin-top:6px">Contact the assigned recipient shown by Vortex.</div>`}</div><label class="small">Amount</label><input id="depAmount" class="input" type="number" placeholder="Amount"><label class="small">Your phone</label><input id="depPhone" class="input" placeholder="07XXXXXXXX"><label class="small">Transaction ID</label><input id="depTxn" class="input" placeholder="Mobile money transaction ID"><button class="primary" data-action="submit-deposit">Submit Deposit</button>`)}
async function submitDeposit(){let amount=Number($("depAmount")?.value||0),phone=$("depPhone")?.value.trim(),txn=$("depTxn")?.value.trim();if(amount<1000){toast("Enter a valid amount");return}if(!validPhone(phone)){toast("Enter a valid 07XXXXXXXX phone");return}if(!txn){toast("Enter transaction ID");return}if(!selectedRecipient){toast("Recipient unavailable");return}try{await db.createRow(DATABASE_ID,DEPOSITS_TABLE_ID,ID.unique(),{userId:user.$id,username:profile.username||"",amount,phone,transactionId:txn,recepient:selectedRecipient,status:"pending",createdat:iso(new Date())});close();toast("Deposit submitted for approval")}catch(e){console.log(e);toast(e.message||"Deposit failed")}}
function withdrawWindow(){let d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=480&&m<=840}
function setWithdrawState(){return}
async function withdraw(){if(!withdrawWindow()){toast("Withdrawals are open from 8:00 AM to 2:00 PM");return}open(`<div class="title">Withdraw</div><div class="sub">Withdrawable balance is your Balance, not Wallet.</div><div class="card balance"><div class="small">Available Balance</div><div class="big">UGX ${fmt(profile?.balance)}</div></div><label class="small">Amount</label><input id="withAmount" class="input" type="number" min="5000" max="5000000" placeholder="5,000 - 5,000,000"><label class="small">Payment phone</label><input id="withPhone" class="input" placeholder="07XXXXXXXX"><button class="primary" data-action="submit-withdraw">Submit Withdrawal</button>`)}
async function submitWithdraw(){let amount=Number($("withAmount")?.value||0),phone=$("withPhone")?.value.trim();if(!withdrawWindow()){toast("Withdrawals are open from 8:00 AM to 2:00 PM");return}if(amount<5000||amount>5000000){toast("Amount must be UGX 5,000 - 5,000,000");return}if(!validPhone(phone)){toast("Enter a valid phone number");return}try{await refreshAccount();let today=new Date().toISOString().slice(0,10),ws=await listRows(WITHDRAWALS_TABLE_ID,[Query.equal("userId",user.$id),Query.equal("withdrawdate",today)]);if(ws.length>=3){toast("Maximum 3 withdrawals per day");return}if(Number(profile.balance||0)<amount){toast("Insufficient Balance");return}let level=Math.max(1,Math.min(6,Number(profile.viplevel||1))),vip=VIP_LEVELS[level-1],now=iso(new Date);await updateUser({balance:Number(profile.balance||0)-amount});try{await db.createRow(DATABASE_ID,WITHDRAWALS_TABLE_ID,ID.unique(),{userId:user.$id,username:profile.username||"",phone:profile.phone||"",amount,paymentphone:phone,status:"pending",createdat:now,processedat:null,transactionId:"",note:"",withdrawdate:today,level,tax:0,processingminutes:vip.minutes})}catch(e){await updateUser({balance:Number(profile.balance||0)});throw e}close();await refreshAccount();toast("Withdrawal submitted for processing")}catch(e){console.log(e);toast(e.message||"Withdrawal failed")}}
function announcementHTML(){return`<div class="card balance"><b>Vortex Announcement</b><div class="small" style="margin-top:6px">Keep your account information correct and follow all transaction instructions.</div></div>`}
function announcements(){open(`<div class="title">Announcements</div>${announcementHTML()}<button class="primary" data-action="close">Close</button>`)}
function chat(){open(`<div class="title">Vortex Chat</div><div class="card"><button class="guideBtn" data-action="chat-group">💬 <span><b>Group Chat</b><small>Connect the Vortex group here</small></span>›</button><button class="guideBtn" data-action="chat-admin">👤 <span><b>Admin Chat</b><small>Contact Vortex admin here</small></span>›</button></div>`)}
function referralLink(){return location.origin+location.pathname+"?ref="+encodeURIComponent(profile?.username||"")}
async function shareReferral(){let u=referralLink();try{if(navigator.share)await navigator.share({title:"Vortex",text:"Join me on Vortex and enjoy your ride.",url:u});else await copyText(u)}catch(e){}}
function invite(){currentScreen="invite";screen("inviteScreen");nav("invite");let u=referralLink();$("inviteContent").innerHTML=`<div class="title">Invite</div><div class="sub">Invite members and grow your referral earnings.</div><div class="card balance"><div class="small">Your referral link</div><div style="word-break:break-all;font-weight:900;margin-top:6px">${esc(u)}</div><div class="grid"><button class="primary" data-action="copy-ref">Copy</button><button class="primary" data-action="share-ref">Share</button></div></div><div class="statGrid"><div class="statBox"><span class="small">Referrals</span><b>${fmt(profile?.referrals||profile?.referralcount||0)}</b></div><div class="statBox"><span class="small">Earned</span><b>UGX ${fmt(profile?.totalreferral)}</b></div><div class="statBox"><span class="small">VIP</span><b>${Number(profile?.viplevel||1)}</b></div></div>`}
function vault(){open(`<div class="title">Vault</div><div class="card balance" style="text-align:center"><div class="big">COMING SOON</div><div class="small">The Vortex Vault will be available in a future update.</div></div><button class="primary" data-action="close">Close</button>`)}
function helpPage(){currentScreen="help";screen("helpScreen");nav("my");$("helpContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Help & Guide</div><div class="card"><b>Wallet</b><div class="small">Approved deposits are credited to Wallet. Wallet funds are used for product purchases.</div></div><div class="card"><b>Balance</b><div class="small">Balance contains withdrawable earnings and referral earnings.</div></div><div class="card"><b>Withdrawals</b><div class="small">Withdrawals are available from 8:00 AM to 2:00 PM, UGX 5,000–5,000,000, maximum 3 per day.</div></div>`}
 <script>
function txTime(x){let t=new Date(x?.createdat||x?.$createdAt||0).getTime();return Number.isFinite(t)?t:0}
function transactionDate(x){let t=txTime(x);return t?new Date(t).toLocaleString("en-UG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function transactionStatus(status){let s=String(status||"pending").toLowerCase();if(s==="approved")return`<span style="color:#216b35;font-weight:900">🟢 APPROVED</span>`;if(s==="rejected")return`<span style="color:#9b3b32;font-weight:900">🔴 REJECTED</span>`;return`<span style="color:#9a7a25;font-weight:900">🟡 PROCESSING</span>`}
function withdrawalCountdown(x){let status=String(x.status||"pending").toLowerCase();if(status!=="pending")return"";let level=Math.max(1,Math.min(6,Number(x.level||profile?.viplevel||1))),vip=VIP_LEVELS[level-1]||VIP_LEVELS[0],start=txTime(x),end=start+Number(x.processingminutes||vip.minutes||20)*60000,left=end-Date.now();if(left<=0)return`<div class="small" style="margin-top:7px;color:#9a7a25;font-weight:900">⏳ Awaiting admin processing</div>`;let total=Math.floor(left/1000),m=Math.floor(total/60),s=total%60;return`<div class="small" style="margin-top:7px;color:#216b35;font-weight:900">⏳ Processing time: ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")} remaining</div>`}
function transactionCard(x,type){let isDeposit=type==="deposit",status=String(x.status||"pending").toLowerCase(),amount=Number(x.amount||0),extra="";if(isDeposit){extra=`<div class="small" style="margin-top:7px">Transaction ID: <b>${esc(x.transactionId||"—")}</b></div><div class="small" style="margin-top:4px">Phone: ${esc(x.phone||"—")}</div><div class="small" style="margin-top:4px">Recipient: ${esc(x.recepient||x.recipient||"—")}</div>`;if(status==="approved")extra+=`<div class="msg ok" style="margin-top:9px">🟢 Deposit approved and added to Wallet.</div>`;if(status==="rejected")extra+=`<div class="msg err" style="margin-top:9px">🔴 Deposit rejected.</div>`}else{extra=`<div class="small" style="margin-top:7px">Withdraw number: <b>${esc(x.paymentphone||x.phone||"—")}</b></div><div class="small" style="margin-top:4px">Requested: ${transactionDate(x)}</div>${withdrawalCountdown(x)}`;if(status==="approved"){let level=Math.max(1,Math.min(6,Number(x.level||profile?.viplevel||1))),vip=VIP_LEVELS[level-1]||VIP_LEVELS[0],tax=Number(x.tax||vip.tax||0),net=Math.max(0,amount-Math.round(amount*tax/100));extra+=`<div class="msg ok" style="margin-top:9px">🟢 Withdrawal approved.<br>Net payout: <b>UGX ${fmt(net)}</b></div>`}if(status==="rejected")extra+=`<div class="msg err" style="margin-top:9px">🔴 Withdrawal rejected.<br>UGX ${fmt(amount)} returned to your Balance.</div>`}return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div style="font-size:13px;font-weight:900">${isDeposit?"💳 Deposit":"💸 Withdrawal"}</div><div class="small" style="margin-top:4px">${transactionDate(x)}</div></div><div style="text-align:right">${transactionStatus(status)}</div></div><div style="font-size:23px;font-weight:900;margin:12px 0">UGX ${fmt(amount)}</div>${extra}</div>`}
async function loadTransactions(){if(!user)return{deposits:[],withdrawals:[]};try{let[d,w]=await Promise.all([listRows(DEPOSITS_TABLE_ID,[Query.equal("userId",user.$id)]),listRows(WITHDRAWALS_TABLE_ID,[Query.equal("userId",user.$id)])]);return{deposits:(d||[]).sort((a,b)=>txTime(b)-txTime(a)),withdrawals:(w||[]).sort((a,b)=>txTime(b)-txTime(a))}}catch(e){console.log("Transactions:",e);return{deposits:[],withdrawals:[]}}}
function renderTransactions(data){let all=[...(data.deposits||[]).map(x=>({...x,_type:"deposit"})),...(data.withdrawals||[]).map(x=>({...x,_type:"withdrawal"}))].sort((a,b)=>txTime(b)-txTime(a));$("myContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Transactions</div><div class="sub">Track your deposits and withdrawals.</div><div class="card balance"><div class="small">Transaction history</div><div style="font-size:13px;font-weight:900;margin-top:5px">${all.length} transaction${all.length===1?"":"s"}</div></div>${all.length?all.map(x=>transactionCard(x,x._type)).join(""):`<div class="card"><div class="empty">No transactions yet.</div></div>`}`}
async function transactions(){currentScreen="transactions";screen("myScreen");nav("my");$("myContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Transactions</div><div class="sub">Track your deposits and withdrawals.</div><div class="card"><div class="empty">Loading transactions...</div></div>`;let data=await loadTransactions();if(currentScreen==="transactions")renderTransactions(data)}
async function refreshTransactions(){if(!user||currentScreen!=="transactions")return;let data=await loadTransactions();if(currentScreen==="transactions")renderTransactions(data)}

function renderMy(){let p=profile;$("myContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">My Account</div><div class="card"><div class="small">Username</div><b>${esc(p?.username||"Loading...")}</b><div class="small" style="margin-top:9px">Email</div><b>${esc(p?.email||"Loading...")}</b><div class="small" style="margin-top:9px">Phone</div><b>${esc(p?.phone||"Loading...")}</b></div><div class="statGrid"><div class="statBox"><span class="small">Wallet</span><b>UGX ${fmt(p?.wallet)}</b></div><div class="statBox"><span class="small">Balance</span><b>UGX ${fmt(p?.balance)}</b></div><div class="statBox"><span class="small">VIP</span><b>${Number(p?.viplevel||1)}</b></div></div><div class="card" style="margin-top:10px"><div class="small">Referral earnings</div><div class="big">UGX ${fmt(p?.totalreferral)}</div></div>${investmentRecordsHTML()}<button class="guideBtn" data-action="transactions">💳 <span><b>Transactions</b><small>Track deposits and withdrawals</small></span>›</button><button class="guideBtn" data-action="help">▤ <span><b>Help & Guide</b></span>›</button><button class="primary danger" style="margin-top:10px" data-action="logout">Log Out</button>`}
async function home(){currentScreen="home";screen("homeScreen");nav("home");await refreshAccount();$("homeContent").innerHTML=`<div class="top"><div><div class="small">Welcome back</div><div class="title" id="welcome">${esc(profile?.displayname||"Elyte")}</div></div><button class="action" style="padding:9px 12px" data-action="announcements">🔔</button></div><div class="card balance"><div class="small">Wallet</div><div class="big">UGX ${fmt(profile?.wallet)}</div><div class="small" style="margin-top:5px">Used for product purchases</div></div><div class="card"><div class="small">Balance</div><div class="big">UGX ${fmt(profile?.balance)}</div><div class="small" style="margin-top:5px">Withdrawable earnings</div></div><div class="actions"><button class="action" data-action="deposit">💳<br>Deposit</button><button class="action" data-action="withdraw">💸<br>Withdraw</button><button class="action" data-action="daily">📈<br>Daily</button><button class="action" data-action="time">⏱<br>Time</button><button class="action" data-action="vault">🔐<br>Vault</button><button class="action" data-action="chat">💬<br>Chat</button></div>${announcementHTML()}`}
async function login(){let b=document.querySelector('[data-action="login"]');if(b)busy(b);try{let email=$("loginEmail")?.value.trim(),password=$("loginPassword")?.value;if(!validEmail(email)){toast("Enter a valid email");return}if(password.length<8){toast("Password must be at least 8 characters");return}await account.createEmailPasswordSession(email,password);user=await account.get();profile=await getProfile();if(!profile){await account.deleteSession("current");user=null;toast("Account profile not found");return}localStorage.setItem("vortexSession","1");await home()}catch(e){console.log(e);toast(e.message||"Login failed")}finally{if(b)ready(b)}}
async function register(){let b=document.querySelector('[data-action="register"]');if(b)busy(b);try{let username=$("regUsername")?.value.trim(),email=$("regEmail")?.value.trim(),phone=$("regPhone")?.value.trim(),password=$("regPassword")?.value,ref=new URLSearchParams(location.search).get("ref")||"";if(username.length<4){toast("Username must be at least 4 characters");return}if(!validEmail(email)){toast("Enter a valid email");return}if(!validPhone(phone)){toast("Phone must be 07XXXXXXXX");return}if(password.length<8){toast("Password must be at least 8 characters");return}if(!ref){toast("A valid referral link is required");return}await account.create(ID.unique(),email,password, "Elyte");await account.createEmailPasswordSession(email,password);user=await account.get();await db.createRow(DATABASE_ID,USERS_TABLE_ID,user.$id,{$id:user.$id,username,email,phone,displayname:"Elyte",wallet:0,balance:0,totalreferral:0,totalwithdrawn:0,viplevel:1,active:0,referrer:ref,referrerId:ref,createdat:iso(new Date())});profile=await getProfile();localStorage.setItem("vortexSession","1");await home()}catch(e){console.log(e);toast(e.message||"Registration failed")}finally{if(b)ready(b)}}
function logout(){account.deleteSession("current").catch(()=>{});user=null;profile=null;localStorage.removeItem("vortexSession");$("bottomNav").classList.add("hide");showLogin()}
function showRegister(){$("authBox").innerHTML=`<div class="title">Create Account</div><div class="sub">Join Vortex</div><input id="regUsername" class="input" placeholder="Username"><input id="regEmail" class="input" placeholder="Email" type="email"><input id="regPhone" class="input" placeholder="07XXXXXXXX"><input id="regPassword" class="input" placeholder="Password" type="password"><button class="primary" data-action="register">Register</button><button class="guideBtn" data-action="show-login">Already have an account? Log in ›</button>`}
function showLogin(){$("authBox").innerHTML=`<div class="title">Welcome back</div><div class="sub">Log in to Vortex</div><input id="loginEmail" class="input" placeholder="Email" type="email"><input id="loginPassword" class="input" placeholder="Password" type="password"><button class="primary" data-action="login">Log In</button><button class="guideBtn" data-action="show-register">Create an account ›</button>`}
 <script>
function touchActivity(){lastActivity=Date.now()}
function validSession(){return!!user}
function forceSessionLogout(){logout()}
function startSessionTimer(){clearInterval(sessionTimer);sessionTimer=setInterval(()=>{if(user&&Date.now()-lastActivity>86400000)forceSessionLogout()},60000)}
function startLiveSync(){clearInterval(liveTimer);liveTimer=setInterval(async()=>{if(!user)return;if(currentScreen==="transactions")return;try{await refreshAccount();if(currentScreen==="home")await home()}catch(e){}},30000)}
async function restoreSession(){showLogin();try{user=await account.get();if(user){profile=await getProfile();if(profile){localStorage.setItem("vortexSession","1");startSessionTimer();startLiveSync();await home()}else{await account.deleteSession("current");user=null}}}catch(e){user=null}}
async function adminPanel(){let code=prompt("Admin access code");if(code!=="VORTEXADMIN"){toast("Invalid admin code");return}currentScreen="admin";screen("adminScreen");nav("my");$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="sub">Pending transaction control</div><div id="adminList"><div class="card"><div class="empty">Loading...</div></div></div>`;await loadAdmin()}
async function loadAdmin(){try{let[d,w]=await Promise.all([listRows(DEPOSITS_TABLE_ID,[Query.equal("status","pending")]),listRows(WITHDRAWALS_TABLE_ID,[Query.equal("status","pending")])]);$("adminList").innerHTML=`<div class="title" style="font-size:18px">Deposits</div>${d.length?d.map(adminDepositCard).join(""):`<div class="card"><div class="empty">No pending deposits</div></div>`}<div class="title" style="font-size:18px">Withdrawals</div>${w.length?w.map(adminWithdrawalCard).join(""):`<div class="card"><div class="empty">No pending withdrawals</div></div>`}`}catch(e){$("adminList").innerHTML=msg(e.message||"Admin loading failed","err")}}
function adminDepositCard(x){return`<div class="card"><b>UGX ${fmt(x.amount)}</b><div class="small">${esc(x.username||"")} · ${esc(x.phone||"")}<br>TXN: ${esc(x.transactionId||"")}</div><div class="grid"><button class="primary" data-action="admin-deposit" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-deposit-reject" data-id="${x.$id}">Reject</button></div></div>`}
function adminWithdrawalCard(x){return`<div class="card"><b>UGX ${fmt(x.amount)}</b><div class="small">${esc(x.username||"")} · ${esc(x.paymentphone||x.phone||"")}<br>VIP ${Number(x.level||1)}</div><div class="grid"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`}
async function adminDeposit(id,approve){try{let r=(await listRows(DEPOSITS_TABLE_ID,[Query.equal("$id",id)]))[0];if(!r||r.status!=="pending")throw Error("Already processed.");let u=(await listRows(USERS_TABLE_ID,[Query.equal("$id",r.userId)]))[0];if(!u)throw Error("User not found.");if(approve){await db.updateRow(DATABASE_ID,DEPOSITS_TABLE_ID,id,{status:"approved",processedat:iso(new Date())});await db.updateRow(DATABASE_ID,USERS_TABLE_ID,u.$id,{wallet:Number(u.wallet||0)+Number(r.amount||0)});toast("Deposit approved")}else{await db.updateRow(DATABASE_ID,DEPOSITS_TABLE_ID,id,{status:"rejected",processedat:iso(new Date())});toast("Deposit rejected")}await loadAdmin()}catch(e){toast(e.message||"Deposit action failed")}}
async function adminWithdrawal(id,approve){try{let r=(await listRows(WITHDRAWALS_TABLE_ID,[Query.equal("$id",id)]))[0];if(!r||r.status!=="pending")throw Error("Already processed.");let u=(await listRows(USERS_TABLE_ID,[Query.equal("$id",r.userId)]))[0];if(!u)throw Error("User not found.");if(approve){let level=Math.max(1,Math.min(6,Number(r.level||u.viplevel||1))),vip=VIP_LEVELS[level-1],tax=Number(r.tax||vip.tax||0),net=Math.max(0,Number(r.amount||0)-Math.round(Number(r.amount||0)*tax/100));await db.updateRow(DATABASE_ID,WITHDRAWALS_TABLE_ID,id,{status:"approved",processedat:iso(new Date()),tax});await db.updateRow(DATABASE_ID,USERS_TABLE_ID,u.$id,{totalwithdrawn:Number(u.totalwithdrawn||0)+Number(r.amount||0)});toast("Withdrawal approved. Net payout UGX "+fmt(net))}else{await db.updateRow(DATABASE_ID,WITHDRAWALS_TABLE_ID,id,{status:"rejected",processedat:iso(new Date())});await db.updateRow(DATABASE_ID,USERS_TABLE_ID,u.$id,{balance:Number(u.balance||0)+Number(r.amount||0)});toast("Withdrawal rejected and balance returned")}await loadAdmin()}catch(e){toast(e.message||"Withdrawal action failed")}}
async function my(){currentScreen="my";screen("myScreen");nav("my");renderMy();try{await refreshAccount();await loadInvestmentRecords();renderMy()}catch(e){console.log("My:",e);renderMy()}}
document.addEventListener("click",async e=>{let b=e.target.closest("[data-action]");if(!b)return;let a=String(b.dataset.action||""),id=b.dataset.id;try{switch(a){case"login":return await login();case"register":return await register();case"show-register":return showRegister();case"show-login":return showLogin();case"home":return home();case"back-home":return home();case"invite":return invite();case"my":return await my();case"transactions":return await transactions();case"daily":return category("daily");case"time":return category("time");case"vault":return vault();case"help":return helpPage();case"chat":return chat();case"close":return close();case"deposit":return await deposit();case"withdraw":return await withdraw();case"submit-deposit":return await submitDeposit();case"submit-withdraw":return await submitWithdraw();case"copy-recipient":return copyText(selectedRecipient);case"buy":return buy(id);case"purchase":return await purchase(id);case"copy-ref":return copyText(referralLink());case"share-ref":return await shareReferral();case"announcements":return announcements();case"logout":return logout();case"admin-deposit":return await adminDeposit(id,true);case"admin-deposit-reject":return await adminDeposit(id,false);case"admin-withdrawal":return await adminWithdrawal(id,true);case"admin-withdrawal-reject":return await adminWithdrawal(id,false);case"chat-group":toast("Group Chat link can be connected here.");return;case"chat-admin":toast("Admin chat link can be connected here.");return}}catch(err){console.log("Action:",a,err);toast("Please try again.")}});
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")close()});
["click","touchstart","keydown","input"].forEach(x=>document.addEventListener(x,touchActivity,{passive:true}));
setInterval(()=>{if(user&&currentScreen==="transactions")refreshTransactions()},1000);
setInterval(setWithdrawState,30000);
setWithdrawState();
showLogin();
restoreSession();
</script></body></html>
