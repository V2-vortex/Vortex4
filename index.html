function helpPage(){close();currentScreen="help";screen("helpScreen");nav("home");$("helpContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="guideHead"><span>VORTEX</span><b>Help & Guide</b></div><div class="helpList"><details class="helpItem" open><summary>Welcome</summary><div class="helpBody"><p>Welcome to Vortex. Enjoy Your Ride.</p></div></details><details class="helpItem"><summary>How to Deposit</summary><div class="helpBody"><ol><li>Open Deposit.</li><li>Use the displayed recipient.</li><li>Send your amount.</li><li>Enter amount, phone and transaction ID.</li><li>Submit.</li></ol></div></details><details class="helpItem"><summary>How to Withdraw</summary><div class="helpBody"><ol><li>Open Withdraw from 8:00 AM to 2:00 PM.</li><li>Enter amount and phone.</li><li>Submit.</li><li>Up to 3 requests per day.</li></ol></div></details><details class="helpItem"><summary>How to Invite</summary><div class="helpBody"><ol><li>Open Invite.</li><li>Copy or share your link.</li><li>Referrals are tracked automatically.</li></ol></div></details><details class="helpItem"><summary>VIP Levels</summary><div class="helpBody"><div class="vipTable"><table><tr><th>VIP</th><th>Active</th><th>Time</th><th>Tax</th><th>Referral</th></tr>${VIP_LEVELS.map(v=>`<tr><td>${v.level}</td><td>${v.active}</td><td>${v.minutes}m</td><td>${v.tax}%</td><td>${v.ref}%</td></tr>`).join("")}</table></div></div></details><details class="helpItem"><summary>Daily</summary><div class="helpBody"><p>10% daily credit for 150 days.</p></div></details><details class="helpItem"><summary>Time</summary><div class="helpBody"><p>Full return is credited at maturity after 100 days.</p></div></details><details class="helpItem"><summary>Vault</summary><div class="helpBody"><p>Vortex Reveal gives a chance after purchasing a Time product. Choose one of six cards to reveal the assigned reward.</p><p><b>Vortex Pulse:</b> Available when activated by admin.</p></div></details><details class="helpItem"><summary>Security</summary><div class="helpBody"><p>Keep your password and transaction details private.</p></div></details></div>`}
 function txTime(x){let t=new Date(x?.createdat||x?.$createdAt||0).getTime();return Number.isFinite(t)?t:0}
function transactionDate(x){let t=txTime(x);return t?new Date(t).toLocaleString("en-UG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function transactionStatus(s){s=String(s||"pending").toLowerCase();return s=="approved"?`<span style="color:#087f68;font-weight:900">🟢 APPROVED</span>`:s=="rejected"?`<span style="color:#9b3b32;font-weight:900">🔴 REJECTED</span>`:`<span style="color:#9a7a25;font-weight:900">🟡 PROCESSING</span>`}
function withdrawalCountdown(x){if(String(x.status||"pending").toLowerCase()!="pending")return"";let v=VIP_LEVELS[Math.max(0,Math.min(5,Number(x.level||profile?.viplevel||1)-1))],left=txTime(x)+v.minutes*60000-Date.now();if(left<=0)return`<div class="small" style="margin-top:7px">⏳ Awaiting admin processing</div>`;let z=Math.floor(left/1000),m=Math.floor(z/60),s=z%60;return`<div class="small" style="margin-top:7px;color:#087f68;font-weight:900">⏳ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")} remaining</div>`}
function transactionCard(x,type){let d=type=="deposit",s=String(x.status||"pending").toLowerCase(),a=Number(x.amount||0),extra=d?`<div class="small" style="margin-top:7px">Transaction ID: <b>${esc(x.transactionId||"—")}</b></div><div class="small">Phone: ${esc(x.phone||"—")}</div><div class="small">Recipient: ${esc(x.recepient||x.recipient||"—")}</div>`:`<div class="small" style="margin-top:7px">Withdraw number: <b>${esc(x.phone||x.paymentphone||"—")}</b></div>${withdrawalCountdown(x)}`;if(d&&s=="approved")extra+=`<div class="msg ok">🟢 Deposit approved and added to Wallet.</div>`;if(d&&s=="rejected")extra+=`<div class="msg err">🔴 Deposit rejected.</div>`;if(!d&&s=="approved")extra+=`<div class="msg ok">🟢 Withdrawal approved.</div>`;if(!d&&s=="rejected")extra+=`<div class="msg err">🔴 Withdrawal rejected. UGX ${fmt(a)} returned to your Balance.</div>`;return`<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${d?"💳 Deposit":"💸 Withdrawal"}</b><div class="small">${transactionDate(x)}</div></div><div>${transactionStatus(s)}</div></div><div style="font-size:23px;font-weight:900;margin:12px 0">UGX ${fmt(a)}</div>${extra}</div>`}
async function loadTransactions(){if(!user)return{deposits:[],withdrawals:[]};try{let[d,w]=await Promise.all([listRows(DEPOSITS_TABLE_ID,[Query.equal("userId",user.$id)]),listRows(WITHDRAWALS_TABLE_ID,[Query.equal("userId",user.$id)])]);return{deposits:d.sort((a,b)=>txTime(b)-txTime(a)),withdrawals:w.sort((a,b)=>txTime(b)-txTime(a))}}catch(e){return{deposits:[],withdrawals:[]}}}
function renderTransactions(a){return`<button class="back" data-action="back-my">← My Account</button><div class="title">Transactions</div><div class="sub">Your deposits and withdrawals</div><div class="sectionTitle">Deposits</div>${a.deposits.length?a.deposits.map(x=>transactionCard(x,"deposit")).join(""):`<div class="card empty">No deposits found.</div>`}<div class="sectionTitle">Withdrawals</div>${a.withdrawals.length?a.withdrawals.map(x=>transactionCard(x,"withdrawal")).join(""):`<div class="card empty">No withdrawals found.</div>`}`}
async function transactions(){currentScreen="transactions";screen("myScreen");nav("my");$("myContent").innerHTML=`<button class="back" data-action="back-my">← My Account</button><div class="title">Transactions</div><div class="empty">Loading...</div>`;let a=await loadTransactions();if(currentScreen=="transactions")$("myContent").innerHTML=renderTransactions(a)}
async function refreshTransactions(){if(currentScreen!="transactions"||!user)return;let a=await loadTransactions();if(currentScreen=="transactions")$("myContent").innerHTML=renderTransactions(a)}
function renderMy(){let p=profile||{};$("myContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">My Account</div><div class="card"><div class="small">Username</div><b>${esc(p.username||"Loading...")}</b><div class="small" style="margin-top:9px">Email</div><b>${esc(p.email||"Loading...")}</b><div class="small" style="margin-top:9px">Phone</div><b>${esc(p.phone||"Loading...")}</b></div><div class="statGrid"><div class="statBox"><span>Wallet</span><b>UGX ${fmt(p.wallet)}</b></div><div class="statBox"><span>Balance</span><b>UGX ${fmt(p.balance)}</b></div><div class="statBox"><span>VIP</span><b>${Number(p.viplevel||1)}</b></div></div><div class="card" style="margin-top:10px"><div class="small">Referral earnings</div><div class="big">UGX ${fmt(p.totalreferral)}</div></div>${investmentRecordsHTML()}<button class="guideBtn" data-action="transactions">▣ <span><b>Transactions</b><small>Deposits & withdrawals</small></span>›</button><button class="guideBtn" style="margin-top:9px" data-action="help">▤ <span><b>Help & Guide</b><small>Quick guide</small></span>›</button><button class="primary danger" style="margin-top:10px" data-action="logout">Log Out</button>`}
function home(){currentScreen="home";screen("homeScreen");$("revealScreen")?.classList.remove("show");nav("home");updateHeader();setWithdrawState()}
async function login(){let email=String($("loginEmail")?.value||"").trim().toLowerCase(),pass=String($("loginPass")?.value||"");if(!validEmail(email))return msg("loginMsg","Enter a valid email.","err");if(!pass)return msg("loginMsg","Enter your password.","err");busy("loginBtn","Signing in...");try{let r=await db.listRows({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,queries:[Query.equal("email",email),Query.limit(1)]});if(!r.rows?.length)throw Error("NOT_FOUND");let p=r.rows[0];if(String(p.password||"")!=pass)throw Error("BAD_PASSWORD");if(p.blocked===true||String(p.status||"active").toLowerCase()=="blocked")throw Error("BLOCKED");user={$id:p.$id};profile=p;sessionStorage.setItem("vortexUserId",p.$id);touchActivity();startSessionTimer();startLiveSync();await loadPulseStatus();await backfillVaultChances();await loadVaultChances();home();await refreshAccount();toast("Welcome")}catch(e){msg("loginMsg",e.message=="NOT_FOUND"?"Account not found.":e.message=="BAD_PASSWORD"?"Incorrect email or password.":e.message=="BLOCKED"?"Account blocked.":"Unable to sign in.","err")}finally{ready("loginBtn","Sign In")}}
async function register(){let username=String($("regUsername")?.value||"").trim(),email=String($("regEmail")?.value||"").trim().toLowerCase(),phone=String($("regPhone")?.value||"").trim(),pass=String($("regPass")?.value||""),confirm=String($("regConfirm")?.value||"");if(username.length<4)return msg("regMsg","Username must be at least 4 characters.","err");if(!validEmail(email))return msg("regMsg","Enter a valid email.","err");if(!validPhone(phone))return msg("regMsg","Phone must be 07XXXXXXXX.","err");if(pass.length<8)return msg("regMsg","Password must be at least 8 characters.","err");if(pass!=confirm)return msg("regMsg","Passwords do not match.","err");busy("regBtn","Creating...");let created=false,id=ID.unique();try{let all=await listRows(USERS_TABLE_ID),first=!all.length,refUser=null;if(!first){let ref=new URLSearchParams(location.search).get("ref");if(!ref)throw Error("NO_REF");let q=await db.listRows({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,queries:[Query.equal("username",String(ref).trim()),Query.limit(1)]});refUser=q.rows[0]||all.find(x=>String(x.username||"").toLowerCase()==String(ref).toLowerCase());if(!refUser)throw Error("BAD_REF");if(String(refUser.username).toLowerCase()==username.toLowerCase())throw Error("SELF_REF")}if(all.some(x=>String(x.phone||"")==phone))throw Error("PHONE_EXISTS");if(all.some(x=>String(x.email||"").toLowerCase()==email))throw Error("EMAIL_EXISTS");if(all.some(x=>String(x.username||"").toLowerCase()==username.toLowerCase()))throw Error("USERNAME_EXISTS");await account.create(id,email,pass,username);let u=await db.createRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:id,data:{userId:id,username,phone,email,password:pass,displayname:"Elyte",wallet:0,balance:0,viplevel:1,totalearned:0,totalwithdrawn:0,totaldeposited:0,totalreferral:0,blocked:false,status:"active",role:first?"admin":"user",referralcode:username,createdat:iso(new Date())}});created=true;if(refUser)try{await db.createRow({databaseId:DATABASE_ID,tableId:REFERRALS_TABLE_ID,rowId:ID.unique(),data:{referrerId:String(refUser.$id),referrerusername:String(refUser.username||""),referreduserId:String(u.$id),referredusername:username,referralcode:String(refUser.username||""),status:"registered",firstpurchase:false,firstpurchaseamount:0,bonusPercent:0,bonusamount:0,bonuspaid:false,createdat:iso(new Date()),activatedat:""}})}catch(e){}$("loginEmail").value=email;$("loginPass").value="";showLogin();msg("loginMsg","Account created. Sign in.","ok")}catch(e){if(created){$("loginEmail").value=email;$("loginPass").value="";showLogin();msg("loginMsg","Account created. Sign in.","ok")}else msg("regMsg",e.message=="NO_REF"?"Open a valid Vortex referral link.":e.message=="BAD_REF"?"This referral link is not valid.":e.message=="SELF_REF"?"You cannot use your own referral link.":e.message=="PHONE_EXISTS"?"Phone already registered.":e.message=="EMAIL_EXISTS"?"Email already registered.":e.message=="USERNAME_EXISTS"?"Username already taken.":"Registration could not be completed.","err")}finally{ready("regBtn","Create Account")}}
 function logout(){clearInterval(sessionTimer);clearInterval(liveTimer);clearInterval(transactionTimer);sessionTimer=liveTimer=transactionTimer=null;user=profile=null;investmentRecords=[];investmentRefreshCache=null;vaultChances=0;sessionStorage.removeItem("vortexUserId");sessionStorage.removeItem("vortexLastActivity");screen("authScreen");$("bottomNav").classList.add("hide");showLogin();$("loginEmail").value="";$("loginPass").value=""}
function showRegister(){$("loginBox").classList.add("hide");$("registerBox").classList.remove("hide");$("regMsg").innerHTML=""}
function showLogin(){$("registerBox").classList.add("hide");$("loginBox").classList.remove("hide");$("loginMsg").innerHTML=""}
const SESSION_LIMIT=600000;
function touchActivity(){if(user){lastActivity=Date.now();sessionStorage.setItem("vortexLastActivity",String(lastActivity))}}
function validSession(){let x=Number(sessionStorage.getItem("vortexLastActivity")||0);return!x||Date.now()-x<SESSION_LIMIT}
function startSessionTimer(){clearInterval(sessionTimer);touchActivity();sessionTimer=setInterval(()=>{if(user&&Date.now()-lastActivity>=SESSION_LIMIT)logout()},5000)}
function startLiveSync(){clearInterval(liveTimer);liveTimer=setInterval(async()=>{if(!user)return;await refreshAccount();if(currentScreen=="my"){await loadInvestmentRecords();renderMy()}if(currentScreen=="vault"){await loadPulseStatus();await loadVaultChances();renderVault()}},30000)}
async function restoreSession(){let id=sessionStorage.getItem("vortexUserId");if(!id||!validSession())return;try{let p=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:id});if(!p||p.blocked===true||String(p.status||"active").toLowerCase()=="blocked")return logout();user={$id:p.$id};profile=p;touchActivity();startSessionTimer();startLiveSync();await backfillVaultChances();await loadVaultChances();home();await refreshAccount()}catch(e){sessionStorage.removeItem("vortexUserId")}}
function adminDepositCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="small">TX: ${esc(x.transactionId||"")}</div><div class="small">Recipient: ${esc(x.recepient||"")}</div><div class="actions"><button class="primary" data-action="admin-deposit" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-deposit-reject" data-id="${x.$id}">Reject</button></div></div>`}
function adminWithdrawalCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="actions"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`}
async function adminPanel(){if(String(profile?.role||"").toLowerCase()!="admin")return toast("Admin access required.");currentScreen="admin";screen("adminScreen");nav("home");$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="empty">Loading...</div>`;try{let[d,w,u]=await Promise.all([listRows(DEPOSITS_TABLE_ID),listRows(WITHDRAWALS_TABLE_ID),listRows(USERS_TABLE_ID)]);await loadPulseStatus();$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="statGrid"><div class="statBox"><span>Accounts</span><b>${u.length}</b></div><div class="statBox"><span>Deposits</span><b>${d.length}</b></div><div class="statBox"><span>Withdrawals</span><b>${w.length}</b></div></div><div class="sectionTitle">Vortex Pulse</div><div class="card"><div class="adminToggle"><div><b>Reward Code Feature</b><div class="small">${pulseActive?"Pulse is running":"No running reward"}</div></div><div><span class="adminStatus ${pulseActive?"on":"off"}">${pulseActive?"ACTIVE":"INACTIVE"}</span><button class="primary" style="width:auto;margin-top:8px;padding:9px 14px" data-action="toggle-pulse">${pulseActive?"Deactivate":"Activate"}</button></div></div></div><div class="sectionTitle">Deposits</div>${d.filter(x=>String(x.status||"").toLowerCase()=="pending").map(adminDepositCard).join("")||`<div class="empty">No pending deposits.</div>`}<div class="sectionTitle">Withdrawals</div>${w.filter(x=>String(x.status||"").toLowerCase()=="pending").map(adminWithdrawalCard).join("")||`<div class="empty">No pending withdrawals.</div>`}`}catch(e){$("adminContent").innerHTML+=`<div class="msg err">Unable to load admin panel.</div>`}}
async function togglePulse(){if(String(profile?.role||"").toLowerCase()!="admin")return toast("Admin access required.");if(SETTINGS_TABLE_ID=="REPLACE_WITH_SETTINGS_TABLE_ID")return toast("Settings table ID is not configured.");try{let v=!pulseActive;try{await db.updateRow({databaseId:DATABASE_ID,tableId:SETTINGS_TABLE_ID,rowId:"pulse",data:{pulseactive:v}})}catch(e){await db.createRow({databaseId:DATABASE_ID,tableId:SETTINGS_TABLE_ID,rowId:"pulse",data:{pulseactive:v}})}pulseActive=v;toast(v?"Vortex Pulse activated":"Vortex Pulse deactivated");adminPanel()}catch(e){toast("Pulse setting could not be changed.")}}
async function adminDeposit(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!="pending")throw Error("processed");if(approve){let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{wallet:Number(u.wallet||0)+Number(x.amount||0),totaldeposited:Number(u.totaldeposited||0)+Number(x.amount||0)}})}await db.updateRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Deposit approved":"Deposit rejected");adminPanel()}catch(e){toast("Deposit could not be processed.")}}
async function adminWithdrawal(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!="pending")throw Error("processed");let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId}),a=Number(x.amount||0);if(approve)await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{totalwithdrawn:Number(u.totalwithdrawn||0)+a}});else await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{balance:Number(u.balance||0)+a}});await db.updateRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Withdrawal approved":"Withdrawal rejected");adminPanel()}catch(e){toast("Withdrawal could not be processed.")}}
async function my(){currentScreen="my";screen("myScreen");nav("my");renderMy();await refreshAccount();await loadInvestmentRecords();if(currentScreen=="my")renderMy()}
 document.addEventListener("click",async e=>{try{let b=e.target.closest("[data-action]");if(!b)return;e.preventDefault();let a=b.dataset.action,id=b.dataset.id;switch(a){
case"login":return login();case"register":return register();case"show-register":return showRegister();case"show-login":return showLogin();case"home":case"back-home":return home();case"back-my":return my();case"invite":return invite();case"my":return my();case"daily":return category("daily");case"time":return category("time");case"vault":return vault();case"pulse":return pulse();case"redeem-code":return redeemCode();case"reveal":return reveal();case"select-reveal":return selectReveal(b.dataset.card);case"receive-reward":return receiveReward();case"close-reveal":return closeReveal();case"help":return helpPage();case"chat":return chat();case"close":return close();case"deposit":return deposit();case"withdraw":return withdraw();case"submit-deposit":return submitDeposit();case"submit-withdraw":return submitWithdraw();case"copy-recipient":return copyText(selectedRecipient);case"buy":return buy(id);case"purchase":return purchase(id);case"copy-ref":return copyText(referralLink());case"share-ref":return shareReferral();case"announcements":return announcements();case"transactions":return transactions();case"logout":return logout();case"admin-deposit":return adminDeposit(id,true);case"admin-deposit-reject":return adminDeposit(id,false);case"admin-withdrawal":return adminWithdrawal(id,true);case"admin-withdrawal-reject":return adminWithdrawal(id,false);case"toggle-pulse":return togglePulse();case"chat-group":return openLink(TELEGRAM_GROUP);case"chat-admin":return openLink(ADMIN_CHAT)}}catch(err){console.log(err);toast("Something went wrong.")}});
$("modalBg").addEventListener("click",e=>{if(e.target===$("modalBg"))close()});
["pointerdown","keydown","scroll","focus"].forEach(ev=>document.addEventListener(ev,touchActivity,{passive:true}));
setInterval(setWithdrawState,30000);
transactionTimer=setInterval(()=>{if(user&&currentScreen=="transactions")refreshTransactions()},1000);
setInterval(()=>{if(user&&currentScreen=="home"&&$("greetingText"))$("greetingText").textContent=greetingByTime()},60000);
setWithdrawState();
restoreSession();
</script></body></html>
