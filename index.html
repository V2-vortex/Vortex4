lt gives you access to special Vortex rewards.</p><p><b>Vortex Pulse:</b> When activated by admin, users can access the Time Reward feature and available Reward Codes. If it is not activated, tapping Pulse shows “No running reward.”</p><p><b>Vortex Reveal:</b> Purchase a Time product to receive a Reveal chance. Use your chance to select one of six cards and reveal your reward.</p><p>Your available chances are shown on the Vault. Once a chance is used, it cannot be used again.</p></div></details><details class="helpItem"><summary>Security</summary><div class="helpBody"><p>Keep your password and transaction details private.</p></div></details></div>`}catch(e){console.log("Help:",e);toast("Help & Guide could not be opened.")}}
function txTime(x){let t=new Date(x?.createdat||x?.$createdAt||0).getTime();return Number.isFinite(t)?t:0}function transactionDate(x){let t=txTime(x);return t?new Date(t).toLocaleString("en-UG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}function transactionStatus(s){s=String(s||"pending").toLowerCase();if(s==="approved")return`<span style="color:#087f68;font-weight:900">🟢 APPROVED</span>`;if(s==="rejected")return`<span style="color:#9b3b32;font-weight:900">🔴 REJECTED</span>`;return`<span style="color:#9a7a25;font-weight:900">🟡 PROCESSING</span>`}
function withdrawalCountdown(x){let s=String(x.status||"pending").toLowerCase();if(s!=="pending")return"";let level=Math.max(1,Math.min(6,Number(x.level||profile?.viplevel||1))),v=VIP_LEVELS[level-1]||VIP_LEVELS[0],start=txTime(x),left=start+Number(v.minutes||20)*60000-Date.now();if(!start||left<=0)return`<div class="small" style="margin-top:7px;color:#9a7a25;font-weight:900">⏳ Awaiting admin processing</div>`;let z=Math.floor(left/1000),m=Math.floor(z/60),ss=z%60;return`<div class="small" style="margin-top:7px;color:#087f68;font-weight:900">⏳ Processing time: ${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")} remaining</div>`}
function transactionCard(x,type){let dep=type==="deposit",s=String(x.status||"pending").toLowerCase(),amount=Number(x.amount||0),extra="";if(dep){extra=`<div class="small" style="margin-top:7px">Transaction ID: <b>${esc(x.transactionId||"—")}</b></div><div class="small" style="margin-top:4px">Phone: ${esc(x.phone||"—")}</div><div class="small" style="margin-top:4px">Recipient: ${esc(x.recepient||x.recipient||"—")}</div>`;if(s==="approved")extra+=`<div class="msg ok">🟢 Deposit approved and added to Wallet.</div>`;if(s==="rejected")extra+=`<div class="msg err">🔴 Deposit rejected.</div>`}else{extra=`<div class="small" style="margin-top:7px">Withdraw number: <b>${esc(x.phone||x.paymentphone||"—")}</b></div>${withdrawalCountdown(x)}`;if(s==="approved")extra+=`<div class="msg ok">🟢 Withdrawal approved.</div>`;if(s==="rejected")extra+=`<div class="msg err">🔴 Withdrawal rejected.<br>UGX ${fmt(amount)} returned to your Balance.</div>`}return`<div class="card txCard"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${dep?"💳 Deposit":"💸 Withdrawal"}</b><div class="small" style="margin-top:4px">${transactionDate(x)}</div></div><div>${transactionStatus(s)}</div></div><div style="font-size:22px;font-weight:900;margin:11px 0">UGX ${fmt(amount)}</div>${extra}</div>`}
async function loadTransactions(){if(!user)return{deposits:[],withdrawals:[]};try{let[d,w]=await Promise.all([listRows(DEPOSITS_TABLE_ID,[Query.equal("userId",user.$id)]),listRows(WITHDRAWALS_TABLE_ID,[Query.equal("userId",user.$id)])]);return{deposits:(d||[]).sort((a,b)=>txTime(b)-txTime(a)),withdrawals:(w||[]).sort((a,b)=>txTime(b)-txTime(a))}}catch(e){return{deposits:[],withdrawals:[]}}}
 <script>
function renderTransactions(data){let d=data.deposits||[],w=data.withdrawals||[];return`<button class="back" data-action="back-my">← My Account</button><div class="title">Transactions</div><div class="sub small">Your deposits and withdrawals</div><div class="sectionTitle">Deposits</div>${d.length?d.map(x=>transactionCard(x,"deposit")).join(""):`<div class="card empty">No deposits found.</div>`}<div class="sectionTitle">Withdrawals</div>${w.length?w.map(x=>transactionCard(x,"withdrawal")).join(""):`<div class="card empty">No withdrawals found.</div>`}`}
async function transactions(){currentScreen="transactions";screen("myScreen");nav("my");$("myContent").innerHTML=`<button class="back" data-action="back-my">← My Account</button><div class="title">Transactions</div><div class="empty">Loading...</div>`;let data=await loadTransactions();if(currentScreen==="transactions")$("myContent").innerHTML=renderTransactions(data)}
async function refreshTransactions(){if(currentScreen!=="transactions"||!user)return;try{let data=await loadTransactions();if(currentScreen==="transactions")$("myContent").innerHTML=renderTransactions(data)}catch(e){}}
async function loadInvestmentRecords(){if(!user)return;try{let r=await listRows(INVESTMENTS_TABLE_ID,[Query.equal("userId",String(user.$id))]);investmentRecords=(r||[]).sort((a,b)=>txTime(b)-txTime(a));investmentRefreshCache=Date.now()}catch(e){investmentRecords=[]}}
function investmentRecordsHTML(){if(!investmentRecords.length)return`<div class="sectionTitle">Investments</div><div class="card empty">No investments yet.</div>`;return`<div class="sectionTitle">Investments</div>${investmentRecords.map(x=>`<div class="card" style="margin-bottom:9px"><div style="display:flex;justify-content:space-between"><b>${esc(x.productname||"Product")}</b><span class="badge">${esc(x.category||"")}</span></div><div class="line"><span>Amount</span><b>UGX ${fmt(x.amount)}</b></div><div class="line"><span>Status</span><b>${esc(x.status||"active")}</b></div><div class="line"><span>Created</span><b>${transactionDate(x)}</b></div></div>`).join("")}`}
function renderMy(){try{let p=profile||{};$("myContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">My Account</div><div class="card"><div class="small">Username</div><b>${esc(p.username||p.displayname||"Loading...")}</b><div class="small" style="margin-top:9px">Email</div><b>${esc(p.email||"Loading...")}</b><div class="small" style="margin-top:9px">Phone</div><b>${esc(p.phone||"Loading...")}</b></div><div class="statGrid" style="margin-top:10px"><div class="statBox"><span class="small">Wallet</span><b>UGX ${fmt(p.wallet)}</b></div><div class="statBox"><span class="small">Balance</span><b>UGX ${fmt(p.balance)}</b></div><div class="statBox"><span class="small">VIP</span><b>${Number(p.viplevel||1)}</b></div></div><div class="card" style="margin-top:10px"><div class="small">Referral earnings</div><div class="big">UGX ${fmt(p.totalreferral)}</div></div>${investmentRecordsHTML()}<button class="guideBtn" style="margin-top:10px" data-action="transactions">▣ <span><b>Transactions</b><small>Deposits & withdrawals</small></span>›</button><button class="guideBtn" style="margin-top:9px" data-action="help">▤ <span><b>Help & Guide</b><small>Quick guide</small></span>›</button><button class="primary danger" style="margin-top:10px" data-action="logout">Log Out</button>`}catch(e){console.log("Render My:",e)}}
function home(){currentScreen="home";screen("homeScreen");$("revealScreen").classList.remove("show");nav("home");updateHeader();setWithdrawState()}
async function login(){let email=String($("loginEmail")?.value||"").trim().toLowerCase(),pass=String($("loginPass")?.value||"");if(!validEmail(email))return msg("loginMsg","Enter a valid email.","err");if(!pass)return msg("loginMsg","Enter your password.","err");busy("loginBtn","Signing in...");try{let r=await db.listRows({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,queries:[Query.equal("email",email),Query.limit(1)]});if(!r.rows||!r.rows.length)throw Error("NOT_FOUND");let p=r.rows[0];if(String(p.password||"")!==pass)throw Error("BAD_PASSWORD");if(p.blocked===true||String(p.status||"active").toLowerCase()==="blocked")throw Error("BLOCKED");user={$id:p.$id};profile=p;sessionStorage.setItem("vortexUserId",p.$id);touchActivity();startSessionTimer();startLiveSync();await loadPulseStatus();await backfillVaultChances();home();await refreshAccount();toast("Welcome")}catch(e){console.log("Login:",e);msg("loginMsg",e.message==="NOT_FOUND"?"Account not found.":e.message==="BAD_PASSWORD"?"Incorrect email or password.":e.message==="BLOCKED"?"Account blocked.":"Please try again.","err")}finally{ready("loginBtn","Sign In")}}
async function register(){let username=String($("regUsername")?.value||"").trim(),email=String($("regEmail")?.value||"").trim().toLowerCase(),phone=String($("regPhone")?.value||"").trim(),pass=String($("regPass")?.value||""),confirm=String($("regConfirm")?.value||"");if(username.length<4)return msg("regMsg","Username must be at least 4 characters.","err");if(!validEmail(email))return msg("regMsg","Enter a valid email.","err");if(!validPhone(phone))return msg("regMsg","Phone must be 07XXXXXXXX.","err");if(pass.length<8)return msg("regMsg","Password must be at least 8 characters.","err");if(pass!==confirm)return msg("regMsg","Passwords do not match.","err");busy("regBtn","Creating...");let accountCreated=false,rowId=ID.unique();try{let allUsers=await listRows(USERS_TABLE_ID),firstAccount=allUsers.length===0,refUser=null;if(!firstAccount){let ref=new URLSearchParams(location.search).get("ref");if(!ref)throw Error("NO_REF");ref=String(ref).trim();let refs=await db.listRows({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,queries:[Query.equal("username",ref),Query.limit(1)]});refUser=refs.rows[0]||allUsers.find(x=>String(x.username||"").trim().toLowerCase()===ref.toLowerCase())||null;if(!refUser)throw Error("BAD_REF");if(String(refUser.username||"").trim().toLowerCase()===username.toLowerCase())throw Error("SELF_REF")}if(allUsers.some(x=>String(x.phone||"").trim()===phone))throw Error("PHONE_EXISTS");if(allUsers.some(x=>String(x.email||"").trim().toLowerCase()===email))throw Error("EMAIL_EXISTS");if(allUsers.some(x=>String(x.username||"").trim().toLowerCase()===username.toLowerCase()))throw Error("USERNAME_EXISTS");await account.create(rowId,email,pass,username);let u=await db.createRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:rowId,data:{userId:rowId,username,phone,email,password:pass,displayname:"Elyte",wallet:0,balance:0,viplevel:1,totalearned:0,totalwithdrawn:0,totaldeposited:0,totalreferral:0,blocked:false,status:"active",role:firstAccount?"admin":"user",referralcode:username,createdat:iso(new Date())}});accountCreated=true;if(refUser)try{await db.createRow({databaseId:DATABASE_ID,tableId:REFERRALS_TABLE_ID,rowId:ID.unique(),data:{referrerId:String(refUser.$id),referrerusername:String(refUser.username||""),referreduserId:String(u.$id),referredusername:username,referralcode:String(refUser.username||""),status:"registered",firstpurchase:false,firstpurchaseamount:0,bonusPercent:0,bonusamount:0,bonuspaid:false,createdat:iso(new Date()),activatedat:""}})}catch(e){}$("loginEmail").value=email;$("loginPass").value="";$("registerBox").classList.add("hide");$("loginBox").classList.remove("hide");msg("loginMsg","Account created. Sign in.","ok")}catch(e){console.log("Register:",e);if(accountCreated){$("loginEmail").value=email;$("loginPass").value="";$("registerBox").classList.add("hide");$("loginBox").classList.remove("hide");msg("loginMsg","Account created. Sign in.","ok")}else{let z=String(e.message||"").toLowerCase(),duplicate=z.includes("already exists")||z.includes("same email")||z.includes("same id");msg("regMsg",e.message==="NO_REF"?"Open a valid Vortex referral link.":e.message==="BAD_REF"?"This referral link is not valid.":e.message==="SELF_REF"?"You cannot use your own referral link.":e.message==="PHONE_EXISTS"?"Phone already registered.":e.message==="EMAIL_EXISTS"?"Email already registered.":e.message==="USERNAME_EXISTS"?"Username already taken.":duplicate?"This email or account already exists in Appwrite Auth.":"Registration could not be completed. Please try again.","err")}}finally{ready("regBtn","Create Account")}}
 <script>
async function logout(){clearInterval(sessionTimer);clearInterval(liveTimer);clearInterval(transactionTimer);sessionTimer=liveTimer=transactionTimer=null;user=null;profile=null;withdrawRefreshPromise=null;investmentRecords=[];investmentRefreshCache=null;vaultChances=0;sessionStorage.removeItem("vortexUserId");sessionStorage.removeItem("vortexLastActivity");currentScreen="auth";screen("authScreen");$("bottomNav").classList.add("hide");$("loginBox").classList.remove("hide");$("registerBox").classList.add("hide");$("loginEmail").value="";$("loginPass").value=""}
function showRegister(){$("loginBox").classList.add("hide");$("registerBox").classList.remove("hide");$("regMsg").innerHTML=""}function showLogin(){$("registerBox").classList.add("hide");$("loginBox").classList.remove("hide");$("loginMsg").innerHTML=""}
const SESSION_LIMIT=600000;
function touchActivity(){if(!user)return;lastActivity=Date.now();try{sessionStorage.setItem("vortexLastActivity",String(lastActivity))}catch(e){}}function validSession(){try{let x=Number(sessionStorage.getItem("vortexLastActivity")||0);return!x||Date.now()-x<SESSION_LIMIT}catch(e){return false}}function forceSessionLogout(){if(user){logout();toast("Session expired")}}function startSessionTimer(){clearInterval(sessionTimer);touchActivity();sessionTimer=setInterval(()=>{if(user&&Date.now()-lastActivity>=SESSION_LIMIT)forceSessionLogout()},5000)}
function startLiveSync(){clearInterval(liveTimer);liveTimer=setInterval(()=>{if(user)refreshAccount().then(async()=>{await backfillVaultChances();if(currentScreen==="my"){await loadInvestmentRecords();renderMy()}if(currentScreen==="vault"){await loadPulseStatus();await loadVaultChances();renderVault()}setWithdrawState()}).catch(e=>console.log("Live sync:",e))},30000)}
async function restoreSession(){let id=sessionStorage.getItem("vortexUserId");if(!id||!validSession())return;try{let p=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:id});if(!p||p.blocked===true||String(p.status||"active").toLowerCase()==="blocked"){sessionStorage.removeItem("vortexUserId");sessionStorage.removeItem("vortexLastActivity");return}user={$id:p.$id};profile=p;await loadPulseStatus();await backfillVaultChances();touchActivity();startSessionTimer();startLiveSync();home();await refreshAccount()}catch(e){console.log("Restore:",e);sessionStorage.removeItem("vortexUserId")}}
async function adminPanel(){if(!profile||String(profile.role||"").toLowerCase()!=="admin"){toast("Admin access required.");return}currentScreen="admin";screen("adminScreen");nav("home");$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="empty">Loading...</div>`;try{let[d,w,u]=await Promise.all([listRows(DEPOSITS_TABLE_ID),listRows(WITHDRAWALS_TABLE_ID),listRows(USERS_TABLE_ID)]);await loadPulseStatus();$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="statGrid"><div class="statBox"><span class="small">Accounts</span><b>${u.length}</b></div><div class="statBox"><span class="small">Deposits</span><b>${d.length}</b></div><div class="statBox"><span class="small">Withdrawals</span><b>${w.length}</b></div></div><div class="sectionTitle">Vortex Pulse</div><div class="card"><div class="adminToggle"><div><b>Reward Code Feature</b><div class="small" style="margin-top:5px">${pulseActive?"Pulse is running":"No running reward"}</div></div><div style="text-align:right"><span class="adminStatus ${pulseActive?"on":"off"}">${pulseActive?"ACTIVE":"INACTIVE"}</span><button class="primary" style="width:auto;margin-top:8px;padding:9px 14px" data-action="toggle-pulse">${pulseActive?"Deactivate":"Activate"}</button></div></div></div><div class="sectionTitle">Deposits</div>${d.filter(x=>String(x.status||"").toLowerCase()==="pending").map(adminDepositCard).join("")||`<div class="empty">No pending deposits.</div>`}<div class="sectionTitle">Withdrawals</div>${w.filter(x=>String(x.status||"").toLowerCase()==="pending").map(adminWithdrawalCard).join("")||`<div class="empty">No pending withdrawals.</div>`}<div class="sectionTitle">Announcements</div><div class="card"><div class="small">Announcement storage</div><b>ADMIN_ANNOUNCEMENTS</b></div>`}catch(e){console.log("Admin:",e);$("adminContent").innerHTML+=`<div class="msg err">Please try again.</div>`}}
async function togglePulse(){if(!profile||String(profile.role||"").toLowerCase()!=="admin"){toast("Admin access required.");return}try{let v=!pulseActive;try{await db.updateRow({databaseId:DATABASE_ID,tableId:SETTINGS_TABLE_ID,rowId:"pulse",data:{pulseactive:v}})}catch(e){await db.createRow({databaseId:DATABASE_ID,tableId:SETTINGS_TABLE_ID,rowId:"pulse",data:{pulseactive:v}})}pulseActive=v;toast(v?"Vortex Pulse activated":"Vortex Pulse deactivated");await adminPanel()}catch(e){console.log("Pulse setting:",e);toast("Pulse setting could not be changed.")}}
function adminDepositCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="small">TX: ${esc(x.transactionId||"")}</div><div class="small">Recipient: ${esc(x.recepient||"")}</div><div class="actions"><button class="primary" data-action="admin-deposit" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-deposit-reject" data-id="${x.$id}">Reject</button></div></div>`}function adminWithdrawalCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="actions"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`}
async function adminDeposit(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");if(approve){let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{wallet:Number(u.wallet||0)+Number(x.amount||0),totaldeposited:Number(u.totaldeposited||0)+Number(x.amount||0)}})}await db.updateRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Deposit approved":"Deposit rejected");adminPanel()}catch(e){console.log("Admin deposit:",e);toast("Please try again.")}}
async function adminWithdrawal(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId}),amount=Number(x.amount||0);if(approve)await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{totalwithdrawn:Number(u.totalwithdrawn||0)+amount}});else await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{balance:Number(u.balance||0)+amount}});await db.updateRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Withdrawal approved":"Withdrawal rejected");adminPanel()}catch(e){console.log("Admin withdrawal:",e);toast("Please try again.")}}
async function my(){currentScreen="my";screen("myScreen");nav("my");renderMy();try{await refreshAccount();await loadInvestmentRecords();if(currentScreen==="my")renderMy()}catch(e){console.log("My:",e);if(currentScreen==="my")renderMy()}}
document.addEventListener("click",async e=>{try{let b=e.target.closest("[data-action]");if(!b)return;e.preventDefault();let a=String(b.dataset.action||""),id=b.dataset.id||"";switch(a){case"login":return await login();case"register":return await register();case"show-register":return showRegister();case"show-login":return showLogin();case"eye-login":return togglePass("loginPass",b);case"eye-reg":return togglePass("regPass",b);case"home":case"back-home":return home();case"back-my":return await my();case"invite":return invite();case"my":return await my();case"daily":return category("daily");case"time":return category("time");case"vault":return vault();case"pulse":return pulse();case"redeem-code":return redeemCode();case"submit-code":return submitCode();case"reveal":return await reveal();case"select-reveal":return await selectReveal(b.dataset.card);case"receive-reward":return await receiveReward();case"close-reveal":return closeReveal();case"help":return helpPage();case"chat":return chat();case"close":return close();case"deposit":return await deposit();case"withdraw":return await withdraw();case"submit-deposit":return await submitDeposit();case"submit-withdraw":return await submitWithdraw();case"copy-recipient":return copyText(selectedRecipient);case"buy":return buy(id);case"purchase":return await purchase(id);case"copy-ref":return copyText(referralLink());case"share-ref":return await shareReferral();case"announcements":return announcements();case"transactions":return await transactions();case"logout":return await logout();case"admin-deposit":return await adminDeposit(id,true);case"admin-deposit-reject":return await adminDeposit(id,false);case"admin-withdrawal":return await adminWithdrawal(id,true);case"admin-withdrawal-reject":return await adminWithdrawal(id,false);case"toggle-pulse":return await togglePulse();case"chat-group":return openLink(TELEGRAM_GROUP);case"chat-admin":return openLink(ADMIN_CHAT)}}catch(err){console.log("Action:",err);toast("Please try again.")}});
 <script>
