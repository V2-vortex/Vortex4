<script>
const{Client,TablesDB,ID,Query}=Appwrite;
const ENDPOINT="https://cloud.appwrite.io/v1",PROJECT_ID="6a903d26002edcba7c43",DATABASE_ID="6ab93e1f001b1a60b658";
const USERS_TABLE_ID="6ab972e60038e2121462",DEPOSITS_TABLE_ID="6abc15840015fbc8ad75",WITHDRAWALS_TABLE_ID="6abc1c3d0006a5526d37",PRODUCTS_TABLE_ID="6abc2545003164242377",INVESTMENTS_TABLE_ID="6abc26e2000f85014be0",REFERRALS_TABLE_ID="6abcfb0b0027beb5cb1a",RECIPIENTS_TABLE_ID="6ac0a39600062c828059";
const client=new Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID),db=new TablesDB(client);
let user=null,profile=null,currentScreen="home",selectedRecipient="",recipients=[],purchaseBusy=false,busyInvestment=false,liveTimer=null,sessionTimer=null,investmentRecords=[];
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("en-UG"),iso=d=>new Date(d).toISOString();
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function msg(id,t,c="info"){let e=$(id);if(e)e.innerHTML=`<div class="msg ${c}">${esc(t)}</div>`}
function toast(t){let e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2800)}
function open(h){$("modal").innerHTML=h;$("modalBg").classList.add("show")}
function close(){$("modalBg").classList.remove("show");$("modal").innerHTML=""}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id)?.classList.add("active")}
function nav(x){$("bottomNav").classList.remove("hide");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.querySelector(`.nav button[data-action="${x}"]`)?.classList.add("active")}
function busy(id,t){let b=$(id);if(b){b.textContent=t;b.disabled=true}}
function ready(id,t){let b=$(id);if(b){b.textContent=t;b.disabled=false}}
function validPhone(p){return/^07\d{8}$/.test(String(p||"").trim())}
function validEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||"").trim())}
function copyText(t){if(!t)return;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Copy unavailable"));else{let a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("Copied")}}
function openLink(url){
 url=String(url||"").trim();
 if(!url)return;
 try{
  let a=document.createElement("a");
  a.href=url;
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  a.remove();
 }catch(e){
  console.log("Open link:",e);
  window.location.href=url;
 }
}
function dayStart(d){let x=new Date(d);x.setHours(0,0,0,0);return x}
function calendarDayNumber(start,now){return Math.floor((dayStart(now)-dayStart(start))/86400000)+1}
function workingDaysPassed(start,now){let d=dayStart(start),n=dayStart(now),c=0;while(d<=n){let w=d.getDay();if(w!==0&&w!==6)c++;d.setDate(d.getDate()+1)}return c}
function addWorkingDaysInclusive(start,num){let d=dayStart(start),c=0;while(c<num){let w=d.getDay();if(w!==0&&w!==6)c++;if(c<num)d.setDate(d.getDate()+1)}return d}
</script>
<script>
const DAILY=[["Start",10000,1000],["Rise",25000,2500],["Drive",50000,5000],["Boost",100000,10000],["Power",250000,25000],["Pro",500000,50000],["Prime",1000000,100000],["Elite",2000000,200000],["Max",3000000,300000],["Ultra",5000000,500000]];
const TIME=[["Sprint",10000,22000],["Momentum",25000,55000],["Surge",50000,110000],["Advance",100000,220000],["Titan",250000,550000],["Apex",500000,1100000],["Infinity",1000000,2200000],["Summit",2000000,4400000],["Horizon",3000000,6600000],["Zenith",5000000,11000000]];
const VIP_LEVELS=[{level:1,active:0,minutes:20,tax:20,ref:10},{level:2,active:2,minutes:15,tax:15,ref:15},{level:3,active:5,minutes:12,tax:12,ref:18},{level:4,active:10,minutes:10,tax:10,ref:20},{level:5,active:25,minutes:8,tax:8,ref:25},{level:6,active:35,minutes:5,tax:5,ref:40}];

function products(){
 let a=DAILY.map((x,i)=>({id:"d"+(i+1),name:x[0],amount:x[1],daily:x[2],returnamount:x[2]*20,duration:20,category:"daily"}));
 let b=TIME.map((x,i)=>({id:"t"+(i+1),name:x[0],amount:x[1],daily:0,returnamount:x[2],duration:20,category:"time"}));
 return[...a,...b]
}
function findProduct(id){return products().find(x=>x.id===id)}

async function listRows(table,queries=[]){
 try{
  let r=await db.listRows({databaseId:DATABASE_ID,tableId:table,queries:[...queries,Query.limit(500)]});
  return r.rows||[]
 }catch(e){console.log("List:",table,e);throw e}
}

async function getProfile(){
 if(!user)return null;
 try{return await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:user.$id})}
 catch(e){console.log("Profile:",e);return null}
}

async function updateUser(data){
 if(!user)throw Error("NO_USER");
 let r=await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:user.$id,data});
 profile={...(profile||{}),...r};
 updateHeader();
 return r
}

function updateHeader(){
 let p=profile||{};
 if($("headName"))$("headName").textContent=(p.username||"")+" 👋👋";
 if($("wallet"))$("wallet").textContent=fmt(p.wallet);
 if($("balance"))$("balance").textContent=fmt(p.balance);
  }

async function syncWallet(){
 if(!user||!profile)return;
 try{
  let d=await db.listRows({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,queries:[Query.equal("userId",user.$id),Query.equal("status","approved"),Query.limit(500)]});
  let i=await db.listRows({databaseId:DATABASE_ID,tableId:INVESTMENTS_TABLE_ID,queries:[Query.equal("userId",user.$id),Query.limit(500)]});
  let deposits=(d.rows||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  let spent=(i.rows||[]).filter(x=>!["rejected","cancelled"].includes(String(x.status||"").toLowerCase())).reduce((s,x)=>s+Number(x.amount||0),0);
  let wallet=Math.max(0,deposits-spent);
  if(Number(profile.wallet||0)!==wallet||Number(profile.totaldeposited||0)!==deposits)await updateUser({wallet,totaldeposited:deposits});
 }catch(e){console.log("Wallet sync:",e)}
}

function vipForActive(n){
 let v=VIP_LEVELS[0];
 VIP_LEVELS.forEach(x=>{if(n>=x.active)v=x});
 return v
}

async function getVipForUser(uid){
 try{
  let refs=await listRows(REFERRALS_TABLE_ID,[Query.equal("referrerId",String(uid))]);
  let inv=await listRows(INVESTMENTS_TABLE_ID,[]);
  let purchased=new Set(
   inv
    .filter(x=>!["rejected","cancelled"].includes(String(x.status||"").toLowerCase()))
    .map(x=>String(x.userId||""))
  );
  let active=refs.filter(r=>{
   let rid=String(r.referreduserId||"");
   return String(r.status||"").toLowerCase()==="active"||purchased.has(rid);
  }).length;
  return vipForActive(active)
 }catch(e){
  console.log("VIP:",e);
  return VIP_LEVELS[0]
 }
}

async function syncVip(){
 if(!user||!profile)return VIP_LEVELS[0];
 try{
  let v=await getVipForUser(user.$id);
  if(Number(profile.viplevel||1)!==v.level)await updateUser({viplevel:v.level});
  return v
 }catch(e){console.log("VIP sync:",e);return vipForActive(Number(profile.viplevel||1))}
}

async function processInvestments(){
 if(busyInvestment||!user||!profile)return;
 busyInvestment=true;
 try{
  let rows=await db.listRows({databaseId:DATABASE_ID,tableId:INVESTMENTS_TABLE_ID,queries:[Query.equal("userId",user.$id),Query.limit(500)]});
  for(let x of rows.rows||[]){
   let status=String(x.status||"active").toLowerCase(),cat=String(x.category||"").toLowerCase(),start=x.startat||x.createdat,dur=Math.max(1,Number(x.duration||20));
   if(!start||["rejected","cancelled"].includes(status)||!["daily","time"].includes(cat))continue;
   let credited=Number(x.creditedamount||0),add=0,finished=false,endDate=null;
   if(cat==="daily"){
    let daily=Number(x.dailycredit||0),progress=Math.min(dur,calendarDayNumber(start,new Date()));
    add=Math.max(0,progress*daily-credited);
    finished=progress>=dur;
    endDate=dayStart(start);endDate.setDate(endDate.getDate()+dur-1);
   }else{
    let progress=Math.min(dur,workingDaysPassed(start,new Date()));
    endDate=addWorkingDaysInclusive(start,dur);
    finished=progress>=dur;
    if(finished)add=Math.max(0,Number(x.returnamount||0)-credited);
   }
   if(add>0){
    let r=await updateUser({balance:Number(profile.balance||0)+add,totalearned:Number(profile.totalearned||0)+add});
    if(r)credited+=add;
   }
   let ns=finished?(cat==="time"?"matured":"completed"):"active",ea=endDate?iso(endDate):"";
   if(credited!==Number(x.creditedamount||0)||ns!==status||String(x.endat||"")!==ea){
    try{
     await db.updateRow({databaseId:DATABASE_ID,tableId:INVESTMENTS_TABLE_ID,rowId:x.$id,data:{creditedamount:credited,lastcreditat:add>0?iso(new Date()):(x.lastcreditat||""),status:ns,endat:ea}});
    }catch(e){console.log("Investment update:",e)}
   }
  }
 }catch(e){console.log("Earnings sync:",e)}
 finally{busyInvestment=false}
}
async function loadInvestmentRecords(){
 if(!user){investmentRecords=[];return}
 try{
  let r=await db.listRows({
   databaseId:DATABASE_ID,
   tableId:INVESTMENTS_TABLE_ID,
   queries:[Query.equal("userId",user.$id),Query.limit(500)]
  });
  investmentRecords=(r.rows||[]).filter(x=>!["rejected","cancelled"].includes(String(x.status||"").toLowerCase()));
 }catch(e){
  console.log("Investment records:",e);
  investmentRecords=[];
 }
}

function investmentProgress(x){
 let cat=String(x.category||"").toLowerCase();
 let start=x.startat||x.createdat;
 let total=Math.max(1,Number(x.duration||20));
 if(!start)return{done:0,total,pct:0,status:"active"};

 let done=cat==="daily"
  ?Math.min(total,calendarDayNumber(start,new Date()))
  :Math.min(total,workingDaysPassed(start,new Date()));

 let pct=Math.min(100,Math.floor(done/total*100));
 return{done,total,pct,status:done>=total?"out":"active"};
}

function investmentTable(arr,type){
 if(!arr.length)return`<div class="empty">No ${type} products purchased.</div>`;

 return`
 <div class="tableWrap">
  <table class="recordTable">
   <thead>
    <tr>
     <th>Name</th>
     <th>Progress</th>
     <th>Percentage</th>
     <th>Status</th>
    </tr>
   </thead>
   <tbody>
    ${arr.map(x=>{
     let p=investmentProgress(x);
     return`
      <tr>
       <td><b>${esc(x.productname||"Product")}</b></td>
       <td>${p.done}/${p.total} days</td>
       <td>${p.pct}%</td>
       <td>${p.status==="out"?"❌ Out":"🟢 Active"}</td>
      </tr>`;
    }).join("")}
   </tbody>
  </table>

async function creditReferral(inv){
 try{
  if(!user||!inv)return;

  let q=await listRows(
   REFERRALS_TABLE_ID,
   [Query.equal("referreduserId",String(user.$id))]
  );

  let rr=q.find(x=>
   String(x.status||"").toLowerCase()==="registered" &&
   String(x.firstpurchase).toLowerCase()!=="true"
  );

  if(!rr)return;

  let purchaseAmount=Number(inv.amount||0);
  if(purchaseAmount<=0)return;

  let currentVip=await getVipForUser(rr.referrerId);
  let rate=Number(currentVip.ref||0);
  let commission=Math.floor(purchaseAmount*rate/100);

  let referrer=await db.getRow({
   databaseId:DATABASE_ID,
   tableId:USERS_TABLE_ID,
   rowId:String(rr.referrerId)
  });

  if(commission>0){
   await db.updateRow({
    databaseId:DATABASE_ID,
    tableId:USERS_TABLE_ID,
    rowId:String(rr.referrerId),
    data:{
     balance:Number(referrer.balance||0)+commission,
     totalreferral:Number(referrer.totalreferral||0)+commission
    }
   });
  }

  await db.updateRow({
   databaseId:DATABASE_ID,
   tableId:REFERRALS_TABLE_ID,
   rowId:String(rr.$id),
   data:{
    status:"active",
    firstpurchase:true,
    firstpurchaseamount:purchaseAmount,
    bonusPercent:rate,
    bonusamount:commission,
    bonuspaid:commission>0,
    activatedat:iso(new Date())
   }
  });

 }catch(e){
  console.log("Referral commission error:",e);
 }
 }

const SESSION_LIMIT=600000;
let lastActivity=0;

function touchActivity(){
 if(!user)return;
 lastActivity=Date.now();
 try{sessionStorage.setItem("vortexLastActivity",String(lastActivity))}catch(e){}
}
function validSession(){
 try{let x=Number(sessionStorage.getItem("vortexLastActivity")||0);return!x||Date.now()-x<SESSION_LIMIT}catch(e){return false}
}
function forceSessionLogout(){if(user){logout();toast("Session expired")}}
function startSessionTimer(){
 clearInterval(sessionTimer);touchActivity();
 sessionTimer=setInterval(()=>{if(user&&Date.now()-lastActivity>=SESSION_LIMIT)forceSessionLogout()},5000)
}
function startLiveSync(){
 clearInterval(liveTimer);
 liveTimer=setInterval(()=>{if(user)refreshAccount().then(()=>{if(currentScreen==="my")renderMy();setWithdrawState()}).catch(e=>console.log("Live sync:",e))},30000)
}

  if(!p||p.blocked===true||String(p.status||"active").toLowerCase()==="blocked"){
   sessionStorage.removeItem("vortexUserId");sessionStorage.removeItem("vortexLastActivity");return
  }
  user={$id:p.$id};profile=p;startSessionTimer();startLiveSync();home();await refreshAccount();
 }catch(e){console.log("Restore:",e);sessionStorage.removeItem("vortexUserId")}
}

function adminDepositCard(x){
 return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="small">TX: ${esc(x.transactionId||"")}</div><div class="small">Recipient: ${esc(x.recepient||"")}</div><div class="actions"><button class="primary" data-action="admin-deposit" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-deposit-reject" data-id="${x.$id}">Reject</button></div></div>`
}

function adminWithdrawalCard(x){
 return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="actions"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`
}

async function adminDeposit(id,approve=true){
 try{
  let x=await db.getRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id});
  if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");
  if(approve){
   let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});
   await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{wallet:Number(u.wallet||0)+Number(x.amount||0),totaldeposited:Number(u.totaldeposited||0)+Number(x.amount||0)}});
  }
  await db.updateRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});
  toast(approve?"Deposit approved":"Deposit rejected");adminPanel();
 }catch(e){console.log("Admin deposit:",e);toast("Please try again.")}
}

async function adminWithdrawal(id,approve=true){
 try{
  let x=await db.getRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id});
  if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");
  if(approve){
   let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});
   if(Number(u.balance||0)<Number(x.amount||0)){toast("Insufficient Balance.");return}
   await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{balance:Number(u.balance||0)-Number(x.amount||0),totalwithdrawn:Number(u.totalwithdrawn||0)+Number(x.amount||0)}});
  }
  await db.updateRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});
  toast(approve?"Withdrawal approved":"Withdrawal rejected");adminPanel();
 }catch(e){console.log("Admin withdrawal:",e);toast("Please try again.")}
}
