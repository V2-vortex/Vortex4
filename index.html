function txTime(x){let t=new Date(x?.createdat||x?.$createdAt||0).getTime();return Number.isFinite(t)?t:0}

function transactionStatus(s){s=String(s||"pending").toLowerCase();if(s==="approved")return`<span style="color:#087f68;font-weight:900">🟢 APPROVED</span>`;if(s==="rejected")return`<span style="color:#9b3b32;font-weight:900">🔴 REJECTED</span>`;return`<span style="color:#9a7a25;font-weight:900">🟡 PROCESSING</span>`}
function withdrawalCountdown(x){let s=String(x.status||"pending").toLowerCase();if(s!=="pending")return"";let level=Math.max(1,Math.min(6,Number(x.level||profile?.viplevel||1))),v=VIP_LEVELS[level-1]||VIP_LEVELS[0],start=txTime(x),left=start+Number(v.minutes||20)*60000-Date.now();if(!start||left<=0)return`<div class="small" style="margin-top:7px;color:#9a7a25;font-weight:900">⏳ Awaiting admin processing</div>`;let z=Math.floor(left/1000),m=Math.floor(z/60),ss=z%60;return`<div class="small" style="margin-top:7px;color:#087f68;font-weight:900">⏳ Processing time: ${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")} remaining</div>`}

function adminDepositCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="small">TX: ${esc(x.transactionId||"")}</div><div class="small">Recipient: ${esc(x.recepient||"")}</div><div class="actions"><button class="primary" data-action="admin-deposit" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-deposit-reject" data-id="${x.$id}">Reject</button></div></div>`}
function adminWithdrawalCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="actions"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`}
async function adminDeposit(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");if(approve){let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{wallet:Number(u.wallet||0)+Number(x.amount||0),totaldeposited:Number(u.totaldeposited||0)+Number(x.amount||0)}})}await db.updateRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Deposit approved":"Deposit rejected");adminPanel()}catch(e){console.log("Admin deposit:",e);toast("Please try again.")}}
async function adminWithdrawal(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!=="pending")throw Error("processed");let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId}),amount=Number(x.amount||0);if(approve)await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{totalwithdrawn:Number(u.totalwithdrawn||0)+amount}});else await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{balance:Number(u.balance||0)+amount}});await db.updateRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Withdrawal approved":"Withdrawal rejected");adminPanel()}catch(e){console.log("Admin withdrawal:",e);toast("Please try again.")}}
async function my(){currentScreen="my";screen("myScreen");nav("my");renderMy();try{await refreshAccount();await loadInvestmentRecords();if(currentScreen==="my")renderMy()}catch(e){console.log("My:",e);if(currentScreen==="my")renderMy()}}
document.addEventListener("click",async e=>{try{let b=e.target.closest("[data-action]");if(!b)return;e.preventDefault();let a=String(b.dataset.action||""),id=b.dataset.id||"";switch(a){case"login":return await login();case"register":return await register();case"show-register":return showRegister();case"show-login":return showLogin();case"home":case"back-home":return home();case"back-my":return await my();case"invite":return invite();case"my":return await my();case"daily":return category("daily");case"time":return category("time");case"vault":return vault();case"pulse":return pulse();case"redeem-code":return redeemCode();case"reveal":return await reveal();case"select-reveal":return await selectReveal(b.dataset.card);case"receive-reward":return await receiveReward();case"close-reveal":return closeReveal();case"help":return helpPage();case"chat":return chat();case"close":return close();case"deposit":return await deposit();case"withdraw":return await withdraw();case"submit-deposit":return await submitDeposit();case"submit-withdraw":return await submitWithdraw();case"copy-recipient":return copyText(selectedRecipient);case"buy":return buy(id);case"purchase":return await purchase(id);case"copy-ref":return copyText(referralLink());case"share-ref":return await shareReferral();case"announcements":return announcements();case"transactions":return await transactions();case"logout":return await logout();case"admin-deposit":return await adminDeposit(id,true);case"admin-deposit-reject":return await adminDeposit(id,false);case"admin-withdrawal":return await adminWithdrawal(id,true);case"admin-withdrawal-reject":return await adminWithdrawal(id,false);case"toggle-pulse":return await togglePulse();case"chat-group":return openLink(TELEGRAM_GROUP);case"chat-admin":return openLink(ADMIN_CHAT)}}catch(err){console.log("Action:",err);toast("Please try again.")}});
$("modalBg").addEventListener("click",e=>{if(e.target===$("modalBg"))close()});
["pointerdown","keydown","scroll","focus"].forEach(ev=>document.addEventListener(ev,touchActivity,{passive:true}));
setInterval(setWithdrawState,30000);transactionTimer=setInterval(()=>{if(user&&currentScreen==="transactions")refreshTransactions()},1000);setInterval(()=>{if(user&&currentScreen==="home"&&$("greetingText"))$("greetingText").textContent=greetingByTime()},60000);setWithdrawState();restoreSession();
</script></body></html>
