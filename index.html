 function txTime(x){let t=new Date(x?.createdat||x?.$createdAt||0).getTime();return Number.isFinite(t)?t:0}

function transactionStatus(s){s=String(s||"pending").toLowerCase();return s=="approved"?`<span style="color:#087f68;font-weight:900">🟢 APPROVED</span>`:s=="rejected"?`<span style="color:#9b3b32;font-weight:900">🔴 REJECTED</span>`:`<span style="color:#9a7a25;font-weight:900">🟡 PROCESSING</span>`}

function adminWithdrawalCard(x){return`<div class="card"><b>${esc(x.username||"User")}</b><div class="small">UGX ${fmt(x.amount)} • ${esc(x.phone||"")}</div><div class="actions"><button class="primary" data-action="admin-withdrawal" data-id="${x.$id}">Approve</button><button class="primary danger" data-action="admin-withdrawal-reject" data-id="${x.$id}">Reject</button></div></div>`}
async function adminPanel(){if(String(profile?.role||"").toLowerCase()!="admin")return toast("Admin access required.");currentScreen="admin";screen("adminScreen");nav("home");$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="empty">Loading...</div>`;try{let[d,w,u]=await Promise.all([listRows(DEPOSITS_TABLE_ID),listRows(WITHDRAWALS_TABLE_ID),listRows(USERS_TABLE_ID)]);await loadPulseStatus();$("adminContent").innerHTML=`<button class="back" data-action="back-home">← Home</button><div class="title">Admin Panel</div><div class="statGrid"><div class="statBox"><span>Accounts</span><b>${u.length}</b></div><div class="statBox"><span>Deposits</span><b>${d.length}</b></div><div class="statBox"><span>Withdrawals</span><b>${w.length}</b></div></div><div class="sectionTitle">Vortex Pulse</div><div class="card"><div class="adminToggle"><div><b>Reward Code Feature</b><div class="small">${pulseActive?"Pulse is running":"No running reward"}</div></div><div><span class="adminStatus ${pulseActive?"on":"off"}">${pulseActive?"ACTIVE":"INACTIVE"}</span><button class="primary" style="width:auto;margin-top:8px;padding:9px 14px" data-action="toggle-pulse">${pulseActive?"Deactivate":"Activate"}</button></div></div></div><div class="sectionTitle">Deposits</div>${d.filter(x=>String(x.status||"").toLowerCase()=="pending").map(adminDepositCard).join("")||`<div class="empty">No pending deposits.</div>`}<div class="sectionTitle">Withdrawals</div>${w.filter(x=>String(x.status||"").toLowerCase()=="pending").map(adminWithdrawalCard).join("")||`<div class="empty">No pending withdrawals.</div>`}`}catch(e){$("adminContent").innerHTML+=`<div class="msg err">Unable to load admin panel.</div>`}}
async function togglePulse(){if(String(profile?.role||"").toLowerCase()!="admin")return toast("Admin access required.");let old=await listRows(PULSE_TABLE_ID,[Query.equal("status","active")]);if(pulseActive){for(let x of old)try{await db.updateRow({databaseId:DATABASE_ID,tableId:PULSE_TABLE_ID,rowId:x.$id,data:{status:"inactive"}})}catch(e){}pulseActive=false;toast("Vortex Pulse deactivated");return adminPanel()}open(`<div class="mh"><h3>Activate Vortex Pulse</h3><button class="close" data-action="close">×</button></div><div class="card"><div class="small">Reward Amount</div><input id="pulseReward" type="number" min="2000" max="10000" placeholder="UGX 2,000 – 10,000"><div class="small">Expiry Minutes</div><input id="pulseExpiry" type="number" min="1" max="5" placeholder="1 – 5 minutes"><div class="small">Maximum Users</div><input id="pulseMax" type="number" min="1" max="100" placeholder="1 – 100 users"><div id="pulseAdminMsg"></div><button class="primary" data-action="activate-pulse">Activate Pulse</button></div>`)}
async function activatePulse(){if(String(profile?.role||"").toLowerCase()!="admin")return toast("Admin access required.");let reward=Number($("pulseReward")?.value||0),expiry=Number($("pulseExpiry")?.value||0),max=Number($("pulseMax")?.value||0);if(reward<2000||reward>10000)return msg("pulseAdminMsg","Reward must be UGX 2,000 – 10,000.","err");if(expiry<1||expiry>5)return msg("pulseAdminMsg","Expiry must be 1 – 5 minutes.","err");if(max<1||max>100)return msg("pulseAdminMsg","Maximum users must be 1 – 100.","err");try{let old=await listRows(PULSE_TABLE_ID,[Query.equal("status","active")]);for(let x of old)try{await db.updateRow({databaseId:DATABASE_ID,tableId:PULSE_TABLE_ID,rowId:x.$id,data:{status:"inactive"}})}catch(e){}let code="",used=[];try{used=await listRows(PULSE_TABLE_ID)}catch(e){}do{code=String(Math.floor(100000+Math.random()*900000))}while(used.some(x=>String(x.code||"")==code));let now=new Date(),expires=new Date(now.getTime()+expiry*60000);await db.createRow({databaseId:DATABASE_ID,tableId:PULSE_TABLE_ID,rowId:ID.unique(),data:{code,rewardvalue:reward,expiryminutes:expiry,maxusers:max,claimedusers:0,status:"active",createdat:iso(now),expiresat:iso(expires),userId:String(user.$id)}});pulseActive=true;close();toast("Pulse activated");adminPanel()}catch(e){console.log("ACTIVATE PULSE:",e);msg("pulseAdminMsg","Pulse could not be activated.","err")}}
 async function adminDeposit(id,approve=true){try{let x=await db.getRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!="pending")throw Error("processed");if(approve){let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId});await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{wallet:Number(u.wallet||0)+Number(x.amount||0),totaldeposited:Number(u.totaldeposited||0)+Number(x.amount||0)}})}await db.updateRow({databaseId:DATABASE_ID,tableId:DEPOSITS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(new Date())}});toast(approve?"Deposit approved":"Deposit rejected");adminPanel()}catch(e){toast("Deposit could not be processed.")}}

async function adminWithdrawal(id,approve=true){try{if(String(profile?.role||"").toLowerCase()!="admin")throw Error("admin");let x=await db.getRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id});if(String(x.status||"").toLowerCase()!="pending")throw Error("processed");let u=await db.getRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId}),a=Number(x.amount||0),now=new Date();if(approve){await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{totalwithdrawn:Number(u.totalwithdrawn||0)+a}})}else{await db.updateRow({databaseId:DATABASE_ID,tableId:USERS_TABLE_ID,rowId:x.userId,data:{balance:Number(u.balance||0)+a}})}await db.updateRow({databaseId:DATABASE_ID,tableId:WITHDRAWALS_TABLE_ID,rowId:id,data:{status:approve?"approved":"rejected",processedat:iso(now),processingminutes:30}});toast(approve?"Withdrawal approved":"Withdrawal rejected");adminPanel()}catch(e){toast("Withdrawal could not be processed.")}}
 
 async function my(){currentScreen="my";screen("myScreen");nav("my");renderMy();await refreshAccount();await loadInvestmentRecords();if(currentScreen=="my")renderMy()}
document.addEventListener("click",async e=>{try{let b=e.target.closest("[data-action]");if(!b)return;e.preventDefault();let a=b.dataset.action,id=b.dataset.id;switch(a){
case"login":return login();case"register":return register();case"show-register":return showRegister();case"show-login":return showLogin();case"home":case"back-home":return home();case"back-my":return my();case"invite":return invite();case"my":return my();case"daily":return category("daily");case"time":return category("time");case"vault":return vault();case"pulse":return pulse();case"redeem-code":return redeemCode();case"reveal":return reveal();case"select-reveal":return selectReveal(b.dataset.card);case"reveal-next":return reveal();case"close-reveal":return closeReveal();case"help":return helpPage();case"chat":return chat();case"close":return close();case"deposit":return deposit();case"withdraw":return withdraw();case"submit-deposit":return submitDeposit();case"submit-withdraw":return submitWithdraw();case"copy-recipient":return copyText(selectedRecipient);case"buy":return buy(id);case"purchase":return purchase(id);case"copy-ref":return copyText(referralLink());case"share-ref":return shareReferral();case"announcements":return announcements();case"transactions":return transactions();case"logout":return logout();case"admin-deposit":return adminDeposit(id,true);case"admin-deposit-reject":return adminDeposit(id,false);case"admin-withdrawal":return adminWithdrawal(id,true);case"admin-withdrawal-reject":return adminWithdrawal(id,false);case"toggle-pulse":return togglePulse();case"activate-pulse":return activatePulse();case"chat-group":return openLink(TELEGRAM_GROUP);case"chat-admin":return openLink(ADMIN_CHAT)}}catch(err){console.log(err);toast("Something went wrong.")}});
$("modalBg").addEventListener("click",e=>{if(e.target===$("modalBg"))close()});
["pointerdown","keydown","scroll","focus"].forEach(ev=>document.addEventListener(ev,touchActivity,{passive:true}));
setInterval(setWithdrawState,30000);
transactionTimer=setInterval(()=>{if(user&&currentScreen=="transactions")refreshTransactions()},1000);
setInterval(()=>{if(user&&currentScreen=="home"&&$("greetingText"))$("greetingText").textContent=greetingByTime()},60000);
setWithdrawState();
restoreSession();

setInterval(()=>{const b=document.querySelector('[data-action="withdraw"]');if(b){b.disabled=false;b.removeAttribute("disabled");}},500);
